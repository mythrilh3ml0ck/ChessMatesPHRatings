<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Chessmate Philippines Ratings</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
    :root {
        --bg-deep: #000000;
        --bg-card: #111111;
        --text-main: #FFFFFF;
        --text-muted: #94A3B8;
        --orange: #FFA500;
        --orange-hover: #E69500;
        --border: #222222;
    }

    *, *::before, *::after {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        margin: 0;
        background-color: #000000;
        background-image:
            linear-gradient(45deg, #080808 25%, transparent 25%, transparent 75%, #080808 75%, #080808),
            linear-gradient(45deg, #080808 25%, transparent 25%, transparent 75%, #080808 75%, #080808);
        background-size: 60px 60px;
        background-position: 0 0, 30px 30px;
        background-attachment: fixed;
        color: var(--text-main);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        user-select: none;
        -webkit-user-select: none;
    }

    .container {
        flex: 1 0 auto;
        padding: 40px 16px;
        padding-top: calc(40px + env(safe-area-inset-top));
        max-width: 480px;
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
    }

    .hero-logo {
        max-width: 180px;
        width: 100%;
        margin: 0 auto 32px auto;
        display: block;
        border-radius: 20px;
        box-shadow: 0 12px 40px rgba(0,0,0,0.6);
    }

    .hero-title {
        font-size: 32px;
        font-weight: 800;
        color: var(--orange);
        margin: 0 auto 12px auto;
        letter-spacing: -0.02em;
        line-height: 1.2;
        text-align: center;
        width: 100%;
    }

    .hero-subtitle {
        color: var(--text-muted);
        font-size: 16px;
        margin: 0 auto 40px auto;
        line-height: 1.5;
        text-align: center;
        width: 100%;
    }

    .search-container {
        display: flex;
        flex-direction: column;
        gap: 12px;
        max-width: 600px;
        margin: 0 auto;
        position: relative;
        width: 100%;
    }

    .search-input-wrapper {
        position: relative;
        width: 100%;
    }

    .search-icon {
        position: absolute;
        left: 14px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-muted);
    }

    input {
        width: 100%;
        padding: 16px 16px 16px 44px;
        font-size: 16px;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 12px;
        color: white;
        outline: none;
        transition: 0.2s;
        -webkit-appearance: none;
    }

    input:focus {
        border-color: var(--orange);
        box-shadow: 0 0 0 3px rgba(255, 165, 0, 0.1);
    }

    .results {
        margin-top: 12px;
        text-align: left;
        max-width: 600px;
        margin-left: auto;
        margin-right: auto;
        background: var(--bg-card);
        border-radius: 12px;
        border: 1px solid var(--border);
        max-height: 300px;
        overflow-y: auto;
        display: none;
        box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }

    .result-item {
        padding: 16px;
        border-bottom: 1px solid var(--border);
        cursor: pointer;
        font-size: 16px;
        text-align: left;
    }

    #mainView, #profile { width: 100%; }
    .profile { display: none; text-align: center; }

    .profile-header {
        margin-bottom: 24px;
        border-bottom: 1px solid var(--border);
        padding-bottom: 16px;
        display: flex;
        justify-content: center;
    }

    .profile-name { font-size: 28px; font-weight: 800; margin: 0; line-height: 1.2; text-align: center; }
    .profile-title { color: var(--orange); }
    .profile-rating { color: var(--orange); font-size: 20px; font-weight: 700; margin-top: 8px; text-align: center; }

    .card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 20px;
        margin-top: 16px;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        display: flex;
        justify-content: center;
    }

    .history-table { width: 100%; border-collapse: collapse; min-width: 280px; }
    .history-table th { text-align: center; color: var(--text-muted); font-size: 12px; text-transform: uppercase; padding-bottom: 12px; letter-spacing: 0.05em; }
    .history-table td { padding: 14px 0; border-top: 1px solid var(--border); font-size: 15px; text-align: center; }

    .change-up { color: #4ADE80; font-weight: 700; }
    .change-down { color: #F87171; font-weight: 700; }

    footer {
        padding: 40px 20px;
        text-align: center;
        border-top: 1px solid var(--border);
        color: var(--text-muted);
        font-size: 13px;
        width: 100%;
    }

    @media (min-width: 768px) {
        .container { max-width: 800px; }
        .hero-title { font-size: 48px; }
        .hero-subtitle { font-size: 18px; }
    }
</style>
</head>
<body oncontextmenu="return false;">

<div class="container">
    <div id="mainView">
        <img src="images/logo/CMPR_Logo.png" class="hero-logo" alt="Main Logo">
        <h1 class="hero-title">Chessmates Philippine Rating</h1>
        <p class="hero-subtitle">Track rating movements for CMP Club</p>

        <div class="search-container">
            <div class="search-input-wrapper">
                <div class="search-icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="16.65" y1="16.65" x2="21" y2="21"/></svg>
                </div>
                <input type="text" id="searchBox" placeholder="LastName, FirstName..." autocomplete="off">
            </div>
        </div>
        <div class="results" id="results"></div>
    </div>

    <div class="profile" id="profile">
        <img src="images/logo/CMPR_Logo.png" class="hero-logo" onclick="goBack()" style="cursor: pointer; max-width: 120px; margin-bottom: 20px;" alt="Logo">
        <div class="profile-header">
            <div>
                <h2 id="playerName" class="profile-name"></h2>
                <div id="playerRating" class="profile-rating"></div>
            </div>
        </div>
        <h3 id="historyTitle" style="margin: 0; font-size: 18px;">Chessmates Philippine Rating History</h3>
        <div class="card" id="historyCard">
            <table class="history-table">
                <thead><tr><th>Date</th><th>Rating</th><th class="change-col">+/-</th></tr></thead>
                <tbody id="ratingHistoryBody"></tbody>
            </table>
        </div>
        <div class="card" id="chartCard">
            <canvas id="ratingChart" style="max-height: 200px;"></canvas>
        </div>
    </div>
</div>

<footer>
    © 2026 All rights reserved <br> Powered by The Lounge
</footer>

<script>
document.addEventListener('contextmenu', e => e.preventDefault());

let masterIndex = [];
let fullCache = {};
let historyFiles = [];

const DB_NAME = "RatingDB";
const STORE_NAME = "cache";

function getFromDB(key) {
    return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, 1);
        request.onsuccess = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains(STORE_NAME)) { resolve(null); return; }
            const tx = db.transaction(STORE_NAME, "readonly");
            const req = tx.objectStore(STORE_NAME).get(key);
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => reject(req.error);
        };
        request.onerror = () => reject(request.error);
    });
}

function processFile(fileData) {
    if (!fileData || !fileData.h || !fileData.r) return [];
    return fileData.r.map(row => {
        const obj = {};
        fileData.h.forEach((h, i) => { obj[h] = row[i] || ""; });
        return obj;
    });
}

async function init() {
    try {
        const cache = await getFromDB("rating_cache");

        if (!cache) {
            window.location.replace('splash.html');
            return;
        }

        fullCache = cache;

        historyFiles = Object.keys(fullCache)
            .filter(name => name !== "PHRapid.csv")
            .sort((a, b) => {
                try {
                    const partsA = a.replace(".csv", "").split(/[_-]/);
                    const partsB = b.replace(".csv", "").split(/[_-]/);
                    return new Date(partsB[0] + " 1, " + partsB[1]) - new Date(partsA[0] + " 1, " + partsA[1]);
                } catch(e) { return 0; }
            });

        let playerMap = new Map();

        // 1. CMP Months (Priority - Latest to Oldest)
        historyFiles.forEach(fn => {
            processFile(fullCache[fn]).forEach(p => {
                const ln = getLN(p);
                const fnP = getFN(p);
                if (!ln) return;

                // Better ID: Use numeric ID if available, otherwise normalized Name
                const id = getID(p) || (normalize(ln) + "|" + normalize(fnP));

                if (!playerMap.has(id)) {
                    // Double check if player already exists under a slightly different name (e.g. w/o initial)
                    let existing = false;
                    for (let entry of playerMap.values()) {
                        if (isSamePlayer(entry, p)) { existing = true; break; }
                    }
                    if (!existing) playerMap.set(id, p);
                }
            });
        });

        // 2. PHRapid Fallback (Only if not in any CMP history)
        if (fullCache["PHRapid.csv"]) {
            processFile(fullCache["PHRapid.csv"]).forEach(p => {
                const ln = getLN(p);
                const fnP = getFN(p);
                if (!ln) return;

                const id = getID(p) || (normalize(ln) + "|" + normalize(fnP));

                // Strict CMP Priority: check if this player exists anywhere in historyFiles
                let inHistory = false;
                for (let entry of playerMap.values()) {
                    if (isSamePlayer(entry, p)) { inHistory = true; break; }
                }

                if (!inHistory) playerMap.set(id, p);
            });
        }

        masterIndex = Array.from(playerMap.values());

    } catch (e) {
        console.error("Init Error:", e);
    }
}

function getVal(p, key) {
    if (!p) return "";
    const ck = key.toLowerCase().replace(/[^a-z0-9]/g, '');
    const ak = Object.keys(p).find(o => o.toLowerCase().replace(/[^a-z0-9]/g, '') === ck);
    return ak ? (p[ak] || "").toString().trim() : "";
}

function getLN(p) {
    let ln = getVal(p, "LastName");
    if (!ln) {
        const full = getVal(p, "Name");
        if (full.includes(",")) {
            ln = full.split(",")[0].trim();
        } else {
            const parts = full.trim().split(/\s+/);
            ln = parts[parts.length - 1] || "";
        }
    }
    return ln;
}
function getFN(p) {
    let fn = getVal(p, "FirstName");
    if (!fn) {
        const full = getVal(p, "Name");
        if (full.includes(",")) {
            fn = full.split(",")[1].trim();
        } else {
            const parts = full.trim().split(/\s+/);
            fn = parts.slice(0, parts.length - 1).join(" ");
        }
    }
    return fn;
}
function getID(p) { return getVal(p, "IDNo") || getVal(p, "ID") || getVal(p, "No"); }
function getRTG(p) { return getVal(p, "RtgNat") || "0"; }
function getTitle(p) { return getVal(p, "TITLE"); }

function normalize(s) {
    return (s || "").toLowerCase()
        .replace(/jr\.?$/, "jr")
        .replace(/\s[a-z]\.?\s/g, " ") // Remove middle initials like " M. " or " M "
        .replace(/\s[a-z]\.?$/g, "")   // Remove trailing middle initials like " M."
        .replace(/[^a-z0-9]/g, "");    // Remove all non-alphanumeric
}

function isSamePlayer(p1, p2) {
    const id1 = getID(p1); const id2 = getID(p2);
    if (id1 && id2 && id1 === id2) return true;

    // Compare normalized names
    const ln1 = normalize(getLN(p1)); const ln2 = normalize(getLN(p2));
    const fn1 = normalize(getFN(p1)); const fn2 = normalize(getFN(p2));

    if (ln1 && ln1 === ln2 && fn1 && fn1 === fn2) return true;

    // Fallback: check if one first name is a prefix of the other (handles "Ervil" vs "Ervil M.")
    if (ln1 && ln1 === ln2) {
        if (fn1.startsWith(fn2) || fn2.startsWith(fn1)) return true;
    }
    return false;
}

document.getElementById("searchBox").addEventListener("input", function() {
    performSearch(this.value.toLowerCase().trim());
});

function performSearch(query) {
    const container = document.getElementById("results");
    if (query.length < 2) { container.style.display = "none"; return; }

    const hasComma = query.includes(",");
    const parts = query.split(",").map(p => p.trim());
    const lnQ = parts[0] || "";
    const fnQ = parts[1] || "";

    const results = masterIndex.filter(p => {
        const ln = getLN(p).toLowerCase();
        const fn = getFN(p).toLowerCase();

        // Comparison versions (stripping dots and extra spaces)
        const clean = (s) => s.replace(/\./g, "").trim();
        const lnC = clean(ln);
        const fnC = clean(fn);
        const lnQC = clean(lnQ);
        const fnQC = clean(fnQ);

        if (hasComma) {
            const match = (q, val) => {
                if (!q) return true;
                if (q.includes("*")) return val.includes(q.replace(/\*/g, ""));
                // Check for startsWith on both raw and clean versions
                return val.startsWith(q) || val.replace(/\./g, "").startsWith(q);
            };
            return match(lnQC, lnC) && match(fnQC, fnC);
        } else {
            if (query.includes("*")) {
                const q = query.replace(/\*/g, "").toLowerCase();
                return lnC.includes(q) || fnC.includes(q);
            }
            return lnC.startsWith(query.replace(/\./g, ""));
        }
    });

    // Sort results: 1. Exact matches first, 2. Shorter matches, 3. Alphabetical
    results.sort((a, b) => {
        const lnA = getLN(a).toLowerCase();
        const lnB = getLN(b).toLowerCase();
        const fnA = getFN(a).toLowerCase();
        const fnB = getFN(b).toLowerCase();

        if (hasComma) {
            // Priority 1: Exact Last Name match
            const exactLNA = lnA === lnQ;
            const exactLNB = lnB === lnQ;
            if (exactLNA !== exactLNB) return exactLNA ? -1 : 1;

            // Priority 2: Exact First Name match
            const exactFNA = fnA === fnQ;
            const exactFNB = fnB === fnQ;
            if (exactFNA !== exactFNB) return exactFNA ? -1 : 1;
        }

        // Priority 3: Shorter total name length
        const lenA = lnA.length + fnA.length;
        const lenB = lnB.length + fnB.length;
        if (lenA !== lenB) return lenA - lenB;

        // Priority 4: Alphabetical
        if (lnA !== lnB) return lnA.localeCompare(lnB);
        return fnA.localeCompare(fnB);
    });

    if (results.length > 0) {
        container.innerHTML = "";
        container.style.display = "block";
        results.slice(0, 30).forEach(p => {
            const div = document.createElement("div");
            div.className = "result-item";
            div.innerText = `${getLN(p)}, ${getFN(p)}`;
            div.onclick = () => showProfile(p);
            container.appendChild(div);
        });
    } else {
        container.innerHTML = "<div class='result-item'>No players found.</div>";
        container.style.display = "block";
    }
}

async function showProfile(p) {
    history.pushState({ view: 'profile' }, '');
    document.getElementById("mainView").style.display = "none";
    document.getElementById("profile").style.display = "block";
    document.getElementById("historyTitle").style.display = "none";
    document.getElementById("historyCard").style.display = "none";
    document.getElementById("chartCard").style.display = "none";

    const title = getTitle(p);
    const nameEl = document.getElementById("playerName");
    nameEl.innerHTML = "";
    if (title && title !== "0") {
        const span = document.createElement("span"); span.className = "profile-title";
        span.innerText = title + " "; nameEl.appendChild(span);
    }
    nameEl.appendChild(document.createTextNode(getFN(p) + " " + getLN(p)));

    const playerHistory = [];
    historyFiles.forEach(fn => {
        const match = processFile(fullCache[fn]).find(x => isSamePlayer(x, p));
        if (match) playerHistory.push({ date: fn.replace(".csv",""), rating: getRTG(match) });
    });

    const nat = processFile(fullCache["PHRapid.csv"]).find(x => isSamePlayer(x, p));
    if (nat) {
        const r = getRTG(nat);
        if (r && r !== "0") playerHistory.push({ date: "National/Initial", rating: r });
    }

    if (playerHistory.length > 0) {
        playerHistory.sort((a, b) => {
            if (a.date === "National/Initial") return 1;
            if (b.date === "National/Initial") return -1;
            return new Date(b.date.replace("_", " ")) - new Date(a.date.replace("_", " "));
        });

        const hasCmp = playerHistory.some(h => h.date !== "National/Initial");
        document.getElementById("playerRating").innerText = (hasCmp ? "CMP Rating: " : "National Rating: ") + playerHistory[0].rating;

        if (hasCmp) {
            document.getElementById("historyTitle").style.display = "block";
            document.getElementById("historyCard").style.display = "flex";
            document.getElementById("chartCard").style.display = "flex";
            displayHistory(playerHistory);
            drawChart(playerHistory);
        }
    }
}

function goBack() { history.back(); }
window.onpopstate = () => {
    document.getElementById("profile").style.display = "none";
    document.getElementById("mainView").style.display = "block";
    document.getElementById("searchBox").value = "";
    document.getElementById("results").style.display = "none";
    if (window.ratingChartInstance) window.ratingChartInstance.destroy();
};

function displayHistory(h) {
    const b = document.getElementById("ratingHistoryBody"); b.innerHTML = "";
    h.forEach((x, i) => {
        const tr = document.createElement("tr");
        const d = document.createElement("td"); d.innerText = x.date.replace("_", " ");
        const r = document.createElement("td"); r.innerText = x.rating;
        const c = document.createElement("td"); c.className = "change-col";
        const n = h[i+1];
        if (n) {
            const diff = parseInt(x.rating) - parseInt(n.rating);
            if (diff > 0) { c.innerText = "+" + diff; c.className += " change-up"; }
            else if (diff < 0) { c.innerText = diff; c.className += " change-down"; }
            else c.innerText = "0";
        } else c.innerText = "-";
        tr.append(d, r, c); b.append(tr);
    });
}

function drawChart(h) {
    const ctx = document.getElementById("ratingChart");
    if (window.ratingChartInstance) window.ratingChartInstance.destroy();
    const sorted = [...h].sort((a, b) => {
        if (a.date === "National/Initial") return -1;
        if (b.date === "National/Initial") return 1;
        return new Date(a.date.replace("_", " ")) - new Date(b.date.replace("_", " "));
    });
    window.ratingChartInstance = new Chart(ctx, {
        type: "line",
        data: {
            labels: sorted.map(x => x.date.replace("_"," ")),
            datasets: [{
                label: "Rating", data: sorted.map(x => x.rating),
                borderColor: "#FFA500", backgroundColor: "rgba(255, 165, 0, 0.1)",
                borderWidth: 2, pointRadius: 4, tension: 0.3, fill: true
            }]
        },
        options: {
            responsive: true, maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
                y: { grid: { color: "#222" }, ticks: { color: "#94A3B8" } },
                x: { grid: { display: false }, ticks: { color: "#94A3B8" } }
            }
        }
    });
}

init();
</script>
</body>
</html>
