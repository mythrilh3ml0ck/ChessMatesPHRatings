<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Chessmate Philippines Ratings</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
    :root {
        --bg-deep: #000000;
        --bg-card: #111111;
        --text-main: #FFFFFF;
        --text-muted: #94A3B8;
        --orange: #FFA500;
        --orange-hover: #E69500;
        --border: #222222;
    }

    *, *::before, *::after {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        margin: 0;
        background-color: #000000;
        background-image:
            linear-gradient(45deg, #080808 25%, transparent 25%, transparent 75%, #080808 75%, #080808),
            linear-gradient(45deg, #080808 25%, transparent 25%, transparent 75%, #080808 75%, #080808);
        background-size: 60px 60px;
        background-position: 0 0, 30px 30px;
        background-attachment: fixed;
        color: var(--text-main);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        user-select: none;
        -webkit-user-select: none;
    }

    header {
        display: none;
    }

    .container {
        flex: 1 0 auto;
        padding: 40px 16px;
        max-width: 480px;
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
    }

    .hero-logo {
        max-width: 180px;
        width: 100%;
        margin: 0 auto 32px auto;
        display: block;
        border-radius: 20px;
        box-shadow: 0 12px 40px rgba(0,0,0,0.6);
    }

    .hero-title {
        font-size: 32px;
        font-weight: 800;
        color: var(--orange);
        margin: 0 auto 12px auto;
        letter-spacing: -0.02em;
        line-height: 1.2;
        text-align: center;
        width: 100%;
    }

    .hero-subtitle {
        color: var(--text-muted);
        font-size: 16px;
        margin: 0 auto 40px auto;
        line-height: 1.5;
        text-align: center;
        width: 100%;
    }

    .search-container {
        display: flex;
        flex-direction: column;
        gap: 12px;
        max-width: 600px;
        margin: 0 auto;
        position: relative;
        width: 100%;
    }

    .search-input-wrapper {
        position: relative;
        width: 100%;
    }

    .search-icon {
        position: absolute;
        left: 14px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-muted);
    }

    input {
        width: 100%;
        padding: 16px 16px 16px 44px;
        font-size: 16px;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 12px;
        color: white;
        outline: none;
        transition: 0.2s;
        -webkit-appearance: none;
    }

    input:focus {
        border-color: var(--orange);
        box-shadow: 0 0 0 3px rgba(255, 165, 0, 0.1);
    }

    .search-btn {
        background: var(--orange);
        color: #000;
        border: none;
        padding: 16px;
        border-radius: 12px;
        font-weight: 700;
        font-size: 16px;
        cursor: pointer;
        transition: 0.2s;
        width: 100%;
    }

    .results {
        margin-top: 12px;
        text-align: left;
        max-width: 600px;
        margin-left: auto;
        margin-right: auto;
        background: var(--bg-card);
        border-radius: 12px;
        border: 1px solid var(--border);
        max-height: 300px;
        overflow-y: auto;
        display: none;
        box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }

    .result-item {
        padding: 16px;
        border-bottom: 1px solid var(--border);
        cursor: pointer;
        font-size: 16px;
        text-align: left;
    }

    #mainView, #profile {
        width: 100%;
    }

    .profile {
        display: none;
        text-align: center;
    }

    .back-btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 16px;
        background: var(--bg-card);
        border: 1px solid var(--border);
        color: var(--text-main);
        border-radius: 10px;
        cursor: pointer;
        margin-bottom: 24px;
        font-size: 14px;
        font-weight: 600;
    }

    .profile-header {
        margin-bottom: 24px;
        border-bottom: 1px solid var(--border);
        padding-bottom: 16px;
        display: flex;
        justify-content: center;
    }

    .profile-name {
        font-size: 28px;
        font-weight: 800;
        margin: 0;
        line-height: 1.2;
        text-align: center;
    }

    .profile-title {
        color: var(--orange);
    }

    .profile-rating {
        color: var(--orange);
        font-size: 20px;
        font-weight: 700;
        margin-top: 8px;
        text-align: center;
    }

    .card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 20px;
        margin-top: 16px;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        display: flex;
        justify-content: center;
    }

    .history-table {
        width: 100%;
        border-collapse: collapse;
        min-width: 280px;
    }

    .history-table th {
        text-align: center;
        color: var(--text-muted);
        font-size: 12px;
        text-transform: uppercase;
        padding-bottom: 12px;
        letter-spacing: 0.05em;
    }

    .history-table td {
        padding: 14px 0;
        border-top: 1px solid var(--border);
        font-size: 15px;
        text-align: center;
    }

    .change-up { color: #4ADE80; font-weight: 700; }
    .change-down { color: #F87171; font-weight: 700; }

    .hide-change .change-col { display: none; }

    footer {
        padding: 40px 20px;
        text-align: center;
        border-top: 1px solid var(--border);
        color: var(--text-muted);
        font-size: 13px;
        width: 100%;
    }

    @media (min-width: 768px) {
        .container, .header-content {
            max-width: 800px;
        }
        .hero-title {
            font-size: 48px;
        }
        .hero-subtitle {
            font-size: 18px;
        }
        .search-container {
            width: 100%;
            max-width: 600px;
        }
    }

    @media (max-width: 480px) {
        .hero-title {
            font-size: 28px;
        }
        .profile-name {
            font-size: 24px;
        }
    }
</style>
</head>
<body oncontextmenu="return false;">

<div class="container">
    <div id="mainView">
        <img src="https://raw.githubusercontent.com/mythrilh3ml0ck/ChessMatesPHRatings/main/chessmates_logo.png" class="hero-logo" alt="Main Logo">
        <h1 class="hero-title">Chessmates Philippine Rating</h1>
        <p class="hero-subtitle">Track rating movements for CMP Club</p>

        <div class="search-container">
            <div class="search-input-wrapper">
                <div class="search-icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                </div>
                <input type="text" id="searchBox" placeholder="LastName, FirstName or ID..." autocomplete="off">
            </div>
        </div>

        <div class="results" id="results"></div>
    </div>

    <div class="profile" id="profile">
        <img src="images/logo/CMPR_Logo.png"
             class="hero-logo"
             onclick="goBack()"
             style="cursor: pointer; max-width: 150px; margin-bottom: 20px;"
             alt="Logo">

        <div class="profile-header">
            <div>
                <h2 id="playerName" class="profile-name"></h2>
                <div id="playerRating" class="profile-rating"></div>
            </div>
        </div>

        <h3 id="historyTitle" style="margin: 0; font-size: 18px;">Chessmates Philippine Rating History</h3>

        <div class="card" id="historyCard">
            <table class="history-table">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Rating</th>
                        <th class="change-col">+/-</th>
                    </tr>
                </thead>
                <tbody id="ratingHistoryBody"></tbody>
            </table>
        </div>

        <div class="card" id="chartCard">
            <canvas id="ratingChart" style="max-height: 200px;"></canvas>
        </div>
    </div>
</div>

<footer>
    © 2026 All rights reserved <br> Powered by The Lounge
</footer>

<script>
// Prevent right-click, source view, and dev tools
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('keydown', e => {
    if (
        e.key === 'F12' ||
        (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'C' || e.key === 'J')) ||
        (e.ctrlKey && e.key === 'U') ||
        (e.ctrlKey && e.key === 'S') ||
        (e.metaKey && e.key === 'u') ||
        (e.metaKey && e.key === 's')
    ) {
        e.preventDefault();
        return false;
    }
});

const GITHUB_TOKEN = "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";
const AUTH_HEADER = { "Authorization": `token ${GITHUB_TOKEN}` };
const RAW_HEADER = { ...AUTH_HEADER, "Accept": "application/vnd.github.v3.raw" };

const repoAPI = "https://api.github.com/repos/mythrilh3ml0ck/ChessMatesPHRatings/contents/CMP";
let cachedData = [];
let fallbackData = [];
let historyFiles = [];
let playerHistory = [];
let csvCache = new Map();

async function init() {
    try {
        const res = await fetch(repoAPI, { headers: AUTH_HEADER });
        const data = await res.json();
        const months = ["january", "february", "march", "april", "may", "june", "july", "august", "september", "october", "november", "december"];

        let monthlyFiles = data.filter(f => {
            const name = f.name.toLowerCase();
            return name.endsWith(".csv") && months.some(m => name.startsWith(m));
        });

        historyFiles = monthlyFiles.sort((a, b) => {
            const dateA = new Date(a.name.replace(".csv", "").replace("_", " "));
            const dateB = new Date(b.name.replace(".csv", "").replace("_", " "));
            return dateB - dateA; // Newest first
        });

        // Load ALL monthly data for better search results
        const loadPromises = historyFiles.map(async (file) => {
            const hRes = await fetch(file.url, { headers: RAW_HEADER });
            const text = await hRes.text();
            const parsed = parseCSV(text);
            csvCache.set(file.name, parsed);
            return parsed;
        });

        const allMonthsResults = await Promise.all(loadPromises);

        // Build combined index for search (most recent record per player)
        let playerMap = new Map();
        allMonthsResults.forEach(monthData => {
            monthData.forEach(p => {
                const id = getID(p) || (getLN(p) + "|" + getFN(p)).toLowerCase();
                if (!playerMap.has(id)) {
                    playerMap.set(id, p);
                }
            });
        });
        cachedData = Array.from(playerMap.values());

        const rapidFile = data.find(f => f.name.toLowerCase() === "phrapid.csv");
        if (rapidFile) {
            const rapidRes = await fetch(rapidFile.url, { headers: RAW_HEADER });
            fallbackData = parseCSV(await rapidRes.text());
        }
    } catch (e) { console.error("Initialization failed", e); }
}

function parseCSV(text) {
    const cleanText = text.replace(/^\uFEFF/, '');
    const lines = cleanText.split(/\r?\n/).filter(l => l.trim().length > 0);
    if (lines.length < 1) return [];

    const headers = lines[0].split(",").map(h => h.trim());

    return lines.slice(1).map(line => {
        const values = []; let cur = ''; let q = false;
        for (let i = 0; i < line.length; i++) {
            if (line[i] === '"') q = !q;
            else if (line[i] === ',' && !q) { values.push(cur.trim()); cur = ''; }
            else cur += line[i];
        }
        values.push(cur.trim());
        const obj = {};
        headers.forEach((h, i) => {
            obj[h] = (values[i] || "").replace(/^"|"$/g, '').trim();
        });
        return obj;
    });
}

function normalize(s) {
    return (s || "").toLowerCase().replace(/jr\.?$/, "jr").replace(/[^a-z0-9]/g, "");
}

// Robust data accessors
function getLN(p) { return (p.LastName || p.NAME || p['Last Name'] || "").trim(); }
function getFN(p) { return (p.FirstName || p['FIRST NAME'] || p['First Name'] || p.FirstNamme || "").trim(); }
function getID(p) { return (p.ID_No || p.No || p.ID || "").trim(); }
function getRTG(p) { return (p.CMP_Rtg || p.Rtg_Nat || p.Rating || p.Rtg || "0").trim(); }
function getTitle(p) { return (p.TITLE || p.Title || "").trim(); }

function isSamePlayer(p1, p2) {
    const id1 = getID(p1);
    const id2 = getID(p2);
    if (id1 && id2 && id1 === id2) return true;

    const ln1 = normalize(getLN(p1));
    const ln2 = normalize(getLN(p2));
    const fn1 = normalize(getFN(p1));
    const fn2 = normalize(getFN(p2));

    return ln1 === ln2 && fn1 === fn2;
}

function triggerSearch() {
    performSearch(document.getElementById("searchBox").value.toLowerCase().trim());
}

document.getElementById("searchBox").addEventListener("input", function() {
    performSearch(this.value.toLowerCase().trim());
});

function performSearch(query) {
    const container = document.getElementById("results");
    if (query.length < 2) { container.style.display = "none"; return; }

    const filterFunc = (p) => {
        const ln = getLN(p).toLowerCase();
        const fn = getFN(p).toLowerCase();
        const id = getID(p).toLowerCase();

        if (query.includes(',')) {
            const parts = query.split(',').map(x => x.trim());
            return ln.startsWith(parts[0]) && fn.startsWith(parts[1] || "");
        }
        return ln.startsWith(query) || id.startsWith(query);
    };

    let latestResults = cachedData.filter(filterFunc);
    let fallbackResults = fallbackData.filter(filterFunc).map(p => ({ ...p, isNational: true }));

    // Avoid duplicates - prioritize CMP data
    let results = [...latestResults];
    fallbackResults.forEach(fp => {
        if (!results.some(rp => isSamePlayer(rp, fp))) {
            results.push(fp);
        }
    });

    if (results.length > 0) {
        container.innerHTML = "";
        container.style.display = "block";
        results.forEach(p => {
            const div = document.createElement("div");
            div.className = "result-item";
            div.innerText = `${getLN(p)}, ${getFN(p)}`;
            div.onclick = () => showProfile(p);
            container.appendChild(div);
        });
    } else { container.style.display = "none"; }
}

async function showProfile(player) {
    history.pushState({ view: 'profile' }, '');
    document.getElementById("mainView").style.display = "none";
    document.getElementById("profile").style.display = "block";

    const historyTitle = document.getElementById("historyTitle");
    const historyCard = document.getElementById("historyCard");
    const chartCard = document.getElementById("chartCard");

    historyTitle.style.display = "none";
    historyCard.style.display = "none";
    chartCard.style.display = "none";

    const pTitle = getTitle(player);
    const titleText = (pTitle && pTitle !== "0") ? pTitle : "";
    const nameEl = document.getElementById("playerName");
    nameEl.innerHTML = "";
    if (titleText) {
        const titleSpan = document.createElement("span");
        titleSpan.className = "profile-title";
        titleSpan.innerText = titleText + " ";
        nameEl.appendChild(titleSpan);
    }
    nameEl.appendChild(document.createTextNode(getFN(player) + " " + getLN(player)));

    const ratingEl = document.getElementById("playerRating");

    playerHistory = [];
    historyFiles.forEach(file => {
        const data = csvCache.get(file.name);
        if (data) {
            const found = data.find(p => isSamePlayer(p, player));
            if (found) {
                playerHistory.push({ date: file.name.replace(".csv",""), rating: getRTG(found) });
            }
        }
    });

    // Check if player has a National rating
    const nationalPlayer = fallbackData.find(p => isSamePlayer(p, player));
    if (nationalPlayer) {
        const nRtg = getRTG(nationalPlayer);
        if (nRtg && nRtg !== "0") {
            playerHistory.push({ date: "National/Initial", rating: nRtg });
        }
    }

    if (playerHistory.length > 0) {
        // Sort for table: Newest first
        playerHistory.sort((a, b) => {
            if (a.date === "National/Initial") return 1;
            if (b.date === "National/Initial") return -1;
            return new Date(b.date.replace("_", " ")) - new Date(a.date.replace("_", " "));
        });

        const hasCmp = playerHistory.some(h => h.date !== "National/Initial");
        ratingEl.innerText = (hasCmp ? "CMP Rating: " : "National Rating: ") + playerHistory[0].rating;
        ratingEl.style.display = "block";

        if (hasCmp) {
            historyTitle.style.display = "block";
            historyTitle.innerText = "Chessmates Philippine Rating History";
            historyCard.style.display = "flex";
            historyCard.classList.remove("hide-change");
            chartCard.style.display = "flex";
            displayHistory(playerHistory);
            drawChart(playerHistory);
        }
    } else {
        ratingEl.style.display = "none";
    }
}

function goBack() { history.back(); }
window.onpopstate = () => {
    document.getElementById("profile").style.display = "none";
    document.getElementById("mainView").style.display = "block";
    document.getElementById("searchBox").value = "";
    document.getElementById("results").style.display = "none";
    if (window.ratingChartInstance) window.ratingChartInstance.destroy();
};

function displayHistory(history) {
    const tbody = document.getElementById("ratingHistoryBody");
    tbody.innerHTML = "";
    const showChange = !document.getElementById("historyCard").classList.contains("hide-change");

    history.forEach((h, index) => {
        const tr = document.createElement("tr");
        const dateCell = document.createElement("td");
        dateCell.innerText = h.date.replace("_", " ");
        const ratingCell = document.createElement("td");
        ratingCell.innerText = h.rating;
        const changeCell = document.createElement("td");
        changeCell.className = "change-col";
        const next = history[index + 1];
        if (next && showChange) {
            const diff = parseInt(h.rating) - parseInt(next.rating);
            if (diff > 0) { changeCell.innerText = "+" + diff; changeCell.className = "change-col change-up"; }
            else if (diff < 0) { changeCell.innerText = diff; changeCell.className = "change-col change-down"; }
            else { changeCell.innerText = "0"; }
        } else { changeCell.innerText = "-"; }
        tr.appendChild(dateCell);
        tr.appendChild(ratingCell);
        tr.appendChild(changeCell);
        tbody.appendChild(tr);
    });
}

function drawChart(history) {
    const ctx = document.getElementById("ratingChart");
    if (window.ratingChartInstance) window.ratingChartInstance.destroy();

    // Explicitly sort from oldest to newest for the graph
    const chronologicalHistory = [...history].sort((a, b) => {
        if (a.date === "National/Initial") return -1;
        if (b.date === "National/Initial") return 1;
        return new Date(a.date.replace("_", " ")) - new Date(b.date.replace("_", " "));
    });

    window.ratingChartInstance = new Chart(ctx, {
        type: "line",
        data: {
            labels: chronologicalHistory.map(h => h.date.replace("_"," ")),
            datasets: [{
                label: "Rating",
                data: chronologicalHistory.map(h => h.rating),
                borderColor: "#FFA500",
                backgroundColor: "rgba(255, 165, 0, 0.1)",
                borderWidth: 2,
                pointRadius: 4,
                pointBackgroundColor: "#000",
                pointBorderColor: "#FFA500",
                tension: 0.3,
                fill: true
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
                y: { grid: { color: "#222" }, ticks: { color: "#94A3B8", font: { size: 10 } } },
                x: { grid: { display: false }, ticks: { color: "#94A3B8", font: { size: 10 } } }
            }
        }
    });
}

init();
</script>
</body>
</html>
