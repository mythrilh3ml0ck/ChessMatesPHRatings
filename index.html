<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chessmate Philippines Ratings</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
    :root {
        --bg-deep: #0B1120;
        --bg-card: #1E293B;
        --text-main: #FFFFFF;
        --text-muted: #94A3B8;
        --orange: #FFA500;
        --orange-hover: #E69500;
        --border: #334155;
    }

    *, *::before, *::after {
        box-sizing: border-box;
    }

    body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        margin: 0;
        background-color: var(--bg-deep);
        background-image: radial-gradient(circle at top right, rgba(255,165,0,0.05), transparent),
                          linear-gradient(to bottom, rgba(11, 17, 32, 0.8), rgba(11, 17, 32, 1)),
                          url('https://images.unsplash.com/photo-1529699211952-734e80c4d42b?auto=format&fit=crop&q=80&w=2000');
        background-attachment: fixed;
        background-size: cover;
        color: var(--text-main);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
    }

    header {
        background: rgba(30, 41, 59, 0.8);
        backdrop-filter: blur(8px);
        border-bottom: 1px solid var(--border);
        padding: 12px 5%;
        display: flex;
        align-items: center;
        gap: 24px;
        position: sticky;
        top: 0;
        z-index: 100;
    }

    .header-logo {
        height: 28px;
    }

    nav {
        display: flex;
        gap: 16px;
    }

    .nav-item {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--text-muted);
        text-decoration: none;
        font-size: 14px;
        font-weight: 500;
        padding: 8px 12px;
        border-radius: 6px;
        transition: 0.2s;
    }

    .nav-item:hover {
        color: var(--text-main);
        background: rgba(255,255,255,0.05);
    }

    .nav-item.active {
        color: #60A5FA;
        background: rgba(96, 165, 250, 0.1);
    }

    .container {
        flex: 1;
        padding: 60px 20px;
        max-width: 1000px;
        margin: 0 auto;
        width: 100%;
        text-align: center;
    }

    .hero-logo {
        max-width: 320px;
        margin-bottom: 32px;
        border-radius: 8px;
        box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }

    .hero-title {
        font-size: 48px;
        font-weight: 800;
        color: var(--orange);
        margin: 0 0 12px 0;
        letter-spacing: -0.02em;
    }

    .hero-subtitle {
        color: var(--text-muted);
        font-size: 18px;
        margin-bottom: 48px;
    }

    .search-container {
        display: flex;
        gap: 12px;
        max-width: 600px;
        margin: 0 auto;
        position: relative;
    }

    .search-input-wrapper {
        position: relative;
        flex: 1;
        min-width: 0; /* Prevents overflow in flexbox */
    }

    .search-icon {
        position: absolute;
        left: 16px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-muted);
    }

    input {
        width: 100%;
        padding: 14px 16px 14px 44px;
        font-size: 15px;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 10px;
        color: white;
        outline: none;
        transition: 0.2s;
    }

    input:focus {
        border-color: var(--orange);
        box-shadow: 0 0 0 2px rgba(255, 165, 0, 0.1);
    }

    .search-btn {
        background: var(--orange);
        color: #000;
        border: none;
        padding: 0 32px;
        border-radius: 10px;
        font-weight: 700;
        font-size: 15px;
        cursor: pointer;
        transition: 0.2s;
        flex-shrink: 0;
    }

    .search-btn:hover {
        background: var(--orange-hover);
        transform: translateY(-1px);
    }

    .results {
        margin-top: 24px;
        text-align: left;
        max-width: 600px;
        margin-left: auto;
        margin-right: auto;
        background: var(--bg-card);
        border-radius: 12px;
        border: 1px solid var(--border);
        max-height: 400px;
        overflow-y: auto;
        display: none;
    }

    .result-item {
        padding: 14px 20px;
        border-bottom: 1px solid var(--border);
        cursor: pointer;
        transition: 0.1s;
    }

    .result-item:last-child { border-bottom: none; }

    .result-item:hover {
        background: rgba(255,255,255,0.05);
    }

    .profile {
        display: none;
        text-align: left;
    }

    .back-btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 16px;
        background: var(--bg-card);
        border: 1px solid var(--border);
        color: var(--text-main);
        border-radius: 8px;
        cursor: pointer;
        margin-bottom: 32px;
        font-size: 14px;
    }

    .profile-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 32px;
        border-bottom: 1px solid var(--border);
        padding-bottom: 24px;
    }

    .profile-name {
        font-size: 32px;
        font-weight: 800;
        margin: 0;
    }

    .profile-title {
        color: var(--orange);
    }

    .profile-rating {
        color: var(--orange);
        font-size: 18px;
        font-weight: 600;
        margin-top: 8px;
    }

    .badge-group {
        display: flex;
        gap: 12px;
        margin-top: 12px;
    }

    .badge {
        padding: 6px 14px;
        background: rgba(255, 165, 0, 0.1);
        color: var(--orange);
        border: 1px solid rgba(255, 165, 0, 0.2);
        border-radius: 99px;
        font-size: 13px;
        font-weight: 600;
    }

    .card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 24px;
        margin-top: 32px;
    }

    .history-table {
        width: 100%;
        border-collapse: collapse;
    }

    .history-table th {
        text-align: left;
        color: var(--text-muted);
        font-size: 12px;
        text-transform: uppercase;
        padding-bottom: 16px;
    }

    .history-table td {
        padding: 12px 0;
        border-top: 1px solid var(--border);
        font-size: 15px;
    }

    .change-up { color: #4ADE80; font-weight: 600; }
    .change-down { color: #F87171; font-weight: 600; }

    footer {
        padding: 40px 20px;
        text-align: center;
        border-top: 1px solid var(--border);
        color: var(--text-muted);
        font-size: 13px;
    }

    @media (max-width: 640px) {
        .hero-title { font-size: 32px; }
        .search-container { flex-direction: column; }
        .search-btn { padding: 14px; width: 100%; }
    }
</style>
</head>
<body>

<header>
    <img src="https://raw.githubusercontent.com/mythrilh3ml0ck/ChessMatesPHRatings/main/chessmates_logo.png" class="header-logo" alt="Logo">
    <nav>
        <a href="#" class="nav-item active" onclick="goBack()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            Home
        </a>
    </nav>
</header>

<div class="container">
    <div id="mainView">
        <img src="https://raw.githubusercontent.com/mythrilh3ml0ck/ChessMatesPHRatings/main/chessmates_logo.png" class="hero-logo" alt="Main Logo">
        <h1 class="hero-title">Chessmates Philippine Ratings</h1>
        <p class="hero-subtitle">Track rating movements for Chessmates Club Rating</p>

        <div class="search-container">
            <div class="search-input-wrapper">
                <div class="search-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                </div>
                <input type="text" id="searchBox" placeholder="Search by Name, Surname, or ID...">
            </div>
            <button class="search-btn" onclick="triggerSearch()">Search</button>
        </div>

        <div class="results" id="results"></div>
    </div>

    <div class="profile" id="profile">
        <button onclick="goBack()" class="back-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
            Back to search
        </button>

        <div class="profile-header">
            <div>
                <h2 id="playerName" class="profile-name"></h2>
                <div id="playerRating" class="profile-rating"></div>
            </div>
        </div>

        <h3 style="margin: 0; font-size: 20px;">Rating History</h3>

        <div class="card">
            <table class="history-table">
                <thead>
                    <tr>
                        <th>Month & Year</th>
                        <th>CMP Rating</th>
                        <th>Change</th>
                    </tr>
                </thead>
                <tbody id="ratingHistoryBody"></tbody>
            </table>
        </div>

        <div class="card">
            <canvas id="ratingChart" style="max-height: 300px;"></canvas>
        </div>
    </div>
</div>

<footer>
    © 2026 All rights reserved | Powered by The Lounge & Chess Lounge
</footer>

<script>
const repoAPI = "https://api.github.com/repos/mythrilh3ml0ck/ChessMatesPHRatings/contents/CMP";
let cachedData = [];
let fallbackData = [];
let latestFile = "";
let historyFiles = [];
let playerHistory = [];

async function getLatestFile() {
    try {
        const res = await fetch(repoAPI);
        const data = await res.json();

        let monthlyFiles = data.filter(f =>
            f.name.toLowerCase().endsWith(".csv") &&
            !["phrating.csv", "phratings.csv", "phrapid.csv"].includes(f.name.toLowerCase())
        );

        historyFiles = monthlyFiles.sort((a, b) => {
            const dateA = new Date(a.name.replace(".csv", "").replace("_", " "));
            const dateB = new Date(b.name.replace(".csv", "").replace("_", " "));
            return dateA - dateB;
        });

        if (historyFiles.length > 0) {
            latestFile = historyFiles[historyFiles.length - 1].download_url;
            const csvRes = await fetch(latestFile);
            cachedData = parseCSV(await csvRes.text());
        }

        const rapidFile = data.find(f => f.name.toLowerCase() === "phrapid.csv");
        if (rapidFile) {
            const rapidRes = await fetch(rapidFile.download_url);
            fallbackData = parseCSV(await rapidRes.text());
        }
    } catch (e) { console.error("Initialization failed", e); }
}

function parseCSV(text) {
    const lines = text.split(/\r?\n/).filter(l => l.trim().length > 0);
    if (lines.length < 1) return [];
    const headers = lines[0].split(",").map(h => h.trim());
    return lines.slice(1).map(line => {
        const values = line.split(",").map(v => v.trim());
        let obj = {};
        headers.forEach((h, i) => { if (h) obj[h] = values[i] || ""; });
        return obj;
    });
}

function triggerSearch() {
    const query = document.getElementById("searchBox").value.toLowerCase().trim();
    if (query.length < 2) return;
    performSearch(query);
}

document.getElementById("searchBox").addEventListener("input", function() {
    performSearch(this.value.toLowerCase().trim());
});

function performSearch(query) {
    const container = document.getElementById("results");
    if (query.length < 2) {
        container.style.display = "none";
        return;
    }

    const filterFunc = (p) => {
        const ln = (p.LastName || "").toLowerCase();
        const fn = (p.FirstName || p.FirstNamme || "").toLowerCase();
        const id = (p.ID_No || "").toLowerCase();

        if (query.includes(',')) {
            const parts = query.split(',').map(x => x.trim());
            return parts.length >= 2 ? (ln.startsWith(parts[0]) && fn.startsWith(parts[1])) : ln.startsWith(parts[0]);
        }
        return ln.includes(query) || fn.includes(query) || id.includes(query);
    };

    let results = cachedData.filter(filterFunc);

    // Fallback to PHRapid if no results in latest monthly file
    if (results.length === 0) {
        results = fallbackData.filter(filterFunc).map(p => ({ ...p, isNational: true }));
    }

    if (results.length > 0) {
        container.innerHTML = "";
        container.style.display = "block";
        results.forEach(p => {
            const div = document.createElement("div");
            div.className = "result-item";
            div.innerText = p.LastName + ", " + (p.FirstName || p.FirstNamme || "");
            div.onclick = () => showProfile(p);
            container.appendChild(div);
        });
    } else {
        container.style.display = "none";
    }
}

async function showProfile(player) {
    document.getElementById("mainView").style.display = "none";
    document.getElementById("profile").style.display = "block";

    const titleText = (player.TITLE && player.TITLE.trim() !== "" && player.TITLE !== "0") ? player.TITLE.trim() : "";
    const nameEl = document.getElementById("playerName");
    nameEl.innerHTML = "";
    if (titleText) {
        const titleSpan = document.createElement("span");
        titleSpan.className = "profile-title";
        titleSpan.innerText = titleText + " ";
        nameEl.appendChild(titleSpan);
    }
    nameEl.appendChild(document.createTextNode((player.FirstName || player.FirstNamme || "") + " " + player.LastName));

    const ratingEl = document.getElementById("playerRating");
    if (player.Rtg_Nat && player.Rtg_Nat !== "0" && player.Rtg_Nat !== "") {
        const label = player.isNational ? "National Rating: " : "CMP Rating: ";
        ratingEl.innerText = label + player.Rtg_Nat;
        ratingEl.style.display = "block";
    } else { ratingEl.style.display = "none"; }

    playerHistory = [];
    for (let file of historyFiles) {
        const res = await fetch(file.download_url);
        const text = await res.text();
        const data = parseCSV(text);
        const found = data.find(p => p.ID_No === player.ID_No);
        if (found) {
            playerHistory.push({
                date: file.name.replace(".csv",""),
                rating: found.Rtg_Nat
            });
        }
    }
    displayHistory();
    drawChart();
}

function goBack() {
    document.getElementById("profile").style.display = "none";
    document.getElementById("mainView").style.display = "block";
    document.getElementById("searchBox").value = "";
    document.getElementById("results").style.display = "none";
    if (window.ratingChartInstance) window.ratingChartInstance.destroy();
}

function displayHistory() {
    const tbody = document.getElementById("ratingHistoryBody");
    tbody.innerHTML = "";
    const sortedHistory = [...playerHistory].reverse();
    sortedHistory.forEach((h, index) => {
        const tr = document.createElement("tr");
        const dateCell = document.createElement("td");
        dateCell.innerText = h.date.replace("_", " ");
        const ratingCell = document.createElement("td");
        ratingCell.innerText = h.rating;
        const changeCell = document.createElement("td");
        const prev = sortedHistory[index + 1];
        if (prev) {
            const diff = parseInt(h.rating) - parseInt(prev.rating);
            if (diff > 0) { changeCell.innerText = "+" + diff; changeCell.className = "change-up"; }
            else if (diff < 0) { changeCell.innerText = diff; changeCell.className = "change-down"; }
            else { changeCell.innerText = "0"; }
        } else { changeCell.innerText = "-"; }
        tr.appendChild(dateCell);
        tr.appendChild(ratingCell);
        tr.appendChild(changeCell);
        tbody.appendChild(tr);
    });
}

function drawChart() {
    const ctx = document.getElementById("ratingChart");
    if (window.ratingChartInstance) window.ratingChartInstance.destroy();
    window.ratingChartInstance = new Chart(ctx, {
        type: "line",
        data: {
            labels: playerHistory.map(h => h.date.replace("_", " ")),
            datasets: [{
                label: "CMP Rating",
                data: playerHistory.map(h => h.rating),
                borderColor: "#FFA500",
                backgroundColor: "rgba(255, 165, 0, 0.1)",
                borderWidth: 3,
                pointRadius: 5,
                pointBackgroundColor: "#0B1120",
                pointBorderColor: "#FFA500",
                tension: 0.3,
                fill: true
            }]
        },
        options: {
            responsive: true,
            plugins: { legend: { display: false } },
            scales: {
                y: { grid: { color: "#334155" }, ticks: { color: "#94A3B8" } },
                x: { grid: { display: false }, ticks: { color: "#94A3B8" } }
            }
        }
    });
}
getLatestFile();
</script>
</body>
</html>
