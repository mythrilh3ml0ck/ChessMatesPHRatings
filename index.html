<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Chessmate Philippines Ratings</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
    :root {
        --bg-deep: #0B1120;
        --bg-card: #1E293B;
        --text-main: #FFFFFF;
        --text-muted: #94A3B8;
        --orange: #FFA500;
        --orange-hover: #E69500;
        --border: #334155;
    }

    *, *::before, *::after {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        margin: 0;
        background-color: var(--bg-deep);
        background-image: radial-gradient(circle at top right, rgba(255,165,0,0.05), transparent),
                          linear-gradient(to bottom, rgba(11, 17, 32, 0.8), rgba(11, 17, 32, 1)),
                          url('https://images.unsplash.com/photo-1529699211952-734e80c4d42b?auto=format&fit=crop&q=80&w=2000');
        background-attachment: fixed;
        background-size: cover;
        color: var(--text-main);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center; /* Center the container */
        user-select: none;
        -webkit-user-select: none;
    }

    header {
        background: rgba(30, 41, 59, 0.8);
        backdrop-filter: blur(8px);
        border-bottom: 1px solid var(--border);
        padding: 12px 16px;
        padding-top: calc(12px + env(safe-area-inset-top));
        display: flex;
        align-items: center;
        justify-content: center; /* Center the header content wrapper */
        position: sticky;
        top: 0;
        z-index: 100;
        width: 100%;
    }

    .header-content {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 16px;
        width: 100%;
        max-width: 800px;
        transition: max-width 0.3s ease;
    }

    .header-logo {
        height: 28px;
    }

    nav {
        display: flex;
        gap: 12px;
    }

    .nav-item {
        display: flex;
        align-items: center;
        gap: 6px;
        color: var(--text-muted);
        text-decoration: none;
        font-size: 14px;
        font-weight: 600;
        padding: 8px 12px;
        border-radius: 8px;
        transition: 0.2s;
    }

    .nav-item.active {
        color: #60A5FA;
        background: rgba(96, 165, 250, 0.1);
    }

    .container {
        flex: 1 0 auto;
        padding: 20px 16px;
        max-width: 480px;
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        transition: max-width 0.3s ease;
    }

    .hero-logo {
        max-width: 280px;
        width: 100%;
        margin: 0 auto 24px auto;
        display: block;
        border-radius: 16px;
        box-shadow: 0 12px 40px rgba(0,0,0,0.6);
    }

    .hero-title {
        font-size: 32px;
        font-weight: 800;
        color: var(--orange);
        margin: 0 auto 8px auto;
        letter-spacing: -0.02em;
        line-height: 1.2;
        text-align: center;
        width: 100%;
    }

    .hero-subtitle {
        color: var(--text-muted);
        font-size: 16px;
        margin: 0 auto 32px auto;
        line-height: 1.5;
        text-align: center;
        width: 100%;
    }

    .search-container {
        display: flex;
        flex-direction: column;
        gap: 12px;
        max-width: 600px;
        margin: 0 auto;
        position: relative;
    }

    .search-input-wrapper {
        position: relative;
        width: 100%;
    }

    .search-icon {
        position: absolute;
        left: 14px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-muted);
    }

    input {
        width: 100%;
        padding: 16px 16px 16px 44px;
        font-size: 16px;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 12px;
        color: white;
        outline: none;
        transition: 0.2s;
        -webkit-appearance: none;
    }

    input:focus {
        border-color: var(--orange);
        box-shadow: 0 0 0 3px rgba(255, 165, 0, 0.1);
    }

    .search-btn {
        background: var(--orange);
        color: #000;
        border: none;
        padding: 16px;
        border-radius: 12px;
        font-weight: 700;
        font-size: 16px;
        cursor: pointer;
        transition: 0.2s;
        width: 100%;
    }

    .results {
        margin-top: 12px;
        text-align: center;
        max-width: 600px;
        margin-left: auto;
        margin-right: auto;
        background: var(--bg-card);
        border-radius: 12px;
        border: 1px solid var(--border);
        max-height: 300px;
        overflow-y: auto;
        display: none;
        box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }

    .result-item {
        padding: 16px;
        border-bottom: 1px solid var(--border);
        cursor: pointer;
        font-size: 16px;
        text-align: center;
    }

    #mainView, #profile {
        width: 100%;
    }

    .profile {
        display: none;
        text-align: center;
    }

    .back-btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 16px;
        background: var(--bg-card);
        border: 1px solid var(--border);
        color: var(--text-main);
        border-radius: 10px;
        cursor: pointer;
        margin-bottom: 24px;
        font-size: 14px;
        font-weight: 600;
    }

    .profile-header {
        margin-bottom: 24px;
        border-bottom: 1px solid var(--border);
        padding-bottom: 16px;
        display: flex;
        justify-content: center;
    }

    .profile-name {
        font-size: 28px;
        font-weight: 800;
        margin: 0;
        line-height: 1.2;
        text-align: center;
    }

    .profile-title {
        color: var(--orange);
    }

    .profile-rating {
        color: var(--orange);
        font-size: 20px;
        font-weight: 700;
        margin-top: 8px;
        text-align: center;
    }

    .card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 20px;
        margin-top: 16px;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        display: flex;
        justify-content: center;
    }

    .history-table {
        width: 100%;
        border-collapse: collapse;
        min-width: 280px;
    }

    .history-table th {
        text-align: center;
        color: var(--text-muted);
        font-size: 12px;
        text-transform: uppercase;
        padding-bottom: 12px;
        letter-spacing: 0.05em;
    }

    .history-table td {
        padding: 14px 0;
        border-top: 1px solid var(--border);
        font-size: 15px;
        text-align: center;
    }

    .change-up { color: #4ADE80; font-weight: 700; }
    .change-down { color: #F87171; font-weight: 700; }

    footer {
        padding: 40px 20px;
        text-align: center;
        border-top: 1px solid var(--border);
        color: var(--text-muted);
        font-size: 13px;
    }

    @media (min-width: 768px) {
        .container, .header-content {
            max-width: 800px;
        }
        .hero-title {
            font-size: 48px;
        }
        .hero-subtitle {
            font-size: 18px;
        }
        .search-container {
            width: 100%;
            max-width: 600px;
        }
    }

    @media (max-width: 480px) {
        .hero-title {
            font-size: 28px;
        }
        .profile-name {
            font-size: 24px;
        }
    }
</style>
</head>
<body oncontextmenu="return false;">

<div class="container">
    <div id="mainView">
        <img src="https://raw.githubusercontent.com/mythrilh3ml0ck/ChessMatesPHRatings/main/chessmates_logo.png" class="hero-logo" alt="Main Logo">
        <h1 class="hero-title">Chessmates Philippine Rating</h1>
        <p class="hero-subtitle">Track rating movements for CMP Club</p>

        <div class="search-container">
            <div class="search-input-wrapper">
                <div class="search-icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                </div>
                <input type="text" id="searchBox" placeholder="LastName, FirstName or ID..." autocomplete="off">
            </div>
        </div>

        <div class="results" id="results"></div>
    </div>

    <div class="profile" id="profile">
        <button onclick="goBack()" class="back-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
            Back
        </button>

        <div class="profile-header">
            <div>
                <h2 id="playerName" class="profile-name"></h2>
                <div id="playerRating" class="profile-rating"></div>
            </div>
        </div>

        <h3 style="margin: 0; font-size: 18px;">Chessmates Philippine Rating History</h3>

        <div class="card">
            <table class="history-table">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Rating</th>
                        <th>+/-</th>
                    </tr>
                </thead>
                <tbody id="ratingHistoryBody"></tbody>
            </table>
        </div>

        <div class="card">
            <canvas id="ratingChart" style="max-height: 200px;"></canvas>
        </div>
    </div>
</div>

<footer>
    © 2026 All rights reserved | Powered by The Lounge & Chess Lounge
</footer>

<script>
// Prevent right-click, source view, and dev tools
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('keydown', e => {
    if (
        e.key === 'F12' ||
        (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'C' || e.key === 'J')) ||
        (e.ctrlKey && e.key === 'U') ||
        (e.ctrlKey && e.key === 'S') ||
        (e.metaKey && e.key === 'u') ||
        (e.metaKey && e.key === 's')
    ) {
        e.preventDefault();
        return false;
    }
});

const repoAPI = "https://api.github.com/repos/mythrilh3ml0ck/ChessMatesPHRatings/contents/CMP";
let cachedData = [];
let fallbackData = [];
let latestFile = "";
let historyFiles = [];
let playerHistory = [];

async function getLatestFile() {
    try {
        const res = await fetch(repoAPI);
        const data = await res.json();
        let monthlyFiles = data.filter(f => f.name.toLowerCase().endsWith(".csv") && !["phrating.csv", "phratings.csv", "phrapid.csv"].includes(f.name.toLowerCase()));
        historyFiles = monthlyFiles.sort((a, b) => {
            const dateA = new Date(a.name.replace(".csv", "").replace("_", " "));
            const dateB = new Date(b.name.replace(".csv", "").replace("_", " "));
            return dateA - dateB;
        });
        if (historyFiles.length > 0) {
            latestFile = historyFiles[historyFiles.length - 1].download_url;
            const csvRes = await fetch(latestFile);
            cachedData = parseCSV(await csvRes.text());
        }
        const rapidFile = data.find(f => f.name.toLowerCase() === "phrapid.csv");
        if (rapidFile) {
            const rapidRes = await fetch(rapidFile.download_url);
            fallbackData = parseCSV(await rapidRes.text());
        }
    } catch (e) { console.error("Initialization failed", e); }
}

function parseCSV(text) {
    const lines = text.split(/\r?\n/).filter(l => l.trim().length > 0);
    if (lines.length < 1) return [];
    const headers = lines[0].split(",").map(h => h.trim());
    return lines.slice(1).map(line => {
        const values = line.split(",").map(v => v.trim());
        let obj = {};
        headers.forEach((h, i) => { if (h) obj[h] = values[i] || ""; });
        return obj;
    });
}

function triggerSearch() {
    const query = document.getElementById("searchBox").value.toLowerCase().trim();
    if (query.length < 2) return;
    performSearch(query);
}

document.getElementById("searchBox").addEventListener("input", function() {
    performSearch(this.value.toLowerCase().trim());
});

function performSearch(query) {
    const container = document.getElementById("results");
    if (query.length < 2) { container.style.display = "none"; return; }
    const filterFunc = (p) => {
        const ln = (p.LastName || "").toLowerCase();
        const fn = (p.FirstName || p.FirstNamme || "").toLowerCase();
        const id = (p.ID_No || "").toLowerCase();

        // Match "LastName, FirstName" format
        if (query.includes(',')) {
            const parts = query.split(',').map(x => x.trim());
            const qLn = parts[0];
            const qFn = parts[1] || "";
            return ln.startsWith(qLn) && fn.startsWith(qFn);
        }

        // Only search in LastName or ID. Standalone FirstName search is disabled.
        return ln.startsWith(query) || id.startsWith(query);
    };
    let results = cachedData.filter(filterFunc);
    if (results.length === 0) results = fallbackData.filter(filterFunc).map(p => ({ ...p, isNational: true }));
    if (results.length > 0) {
        container.innerHTML = "";
        container.style.display = "block";
        results.forEach(p => {
            const div = document.createElement("div");
            div.className = "result-item";
            div.innerText = p.LastName + ", " + (p.FirstName || p.FirstNamme || "");
            div.onclick = () => showProfile(p);
            container.appendChild(div);
        });
    } else { container.style.display = "none"; }
}

async function showProfile(player) {
    document.getElementById("mainView").style.display = "none";
    document.getElementById("profile").style.display = "block";
    const titleText = (player.TITLE && player.TITLE.trim() !== "" && player.TITLE !== "0") ? player.TITLE.trim() : "";
    const nameEl = document.getElementById("playerName");
    nameEl.innerHTML = "";
    if (titleText) {
        const titleSpan = document.createElement("span");
        titleSpan.className = "profile-title";
        titleSpan.innerText = titleText + " ";
        nameEl.appendChild(titleSpan);
    }
    nameEl.appendChild(document.createTextNode((player.FirstName || player.FirstNamme || "") + " " + player.LastName));
    const ratingEl = document.getElementById("playerRating");
    if (player.Rtg_Nat && player.Rtg_Nat !== "0" && player.Rtg_Nat !== "") {
        ratingEl.innerText = (player.isNational ? "National Rating: " : "CMP Rating: ") + player.Rtg_Nat;
        ratingEl.style.display = "block";
    } else { ratingEl.style.display = "none"; }
    playerHistory = [];
    for (let file of historyFiles) {
        const res = await fetch(file.download_url);
        const text = await res.text();
        const data = parseCSV(text);
        const found = data.find(p => p.ID_No === player.ID_No);
        if (found) { playerHistory.push({ date: file.name.replace(".csv",""), rating: found.Rtg_Nat }); }
    }
    displayHistory();
    drawChart();
}

function goBack() {
    document.getElementById("profile").style.display = "none";
    document.getElementById("mainView").style.display = "block";
    document.getElementById("searchBox").value = "";
    document.getElementById("results").style.display = "none";
    if (window.ratingChartInstance) window.ratingChartInstance.destroy();
}

function displayHistory() {
    const tbody = document.getElementById("ratingHistoryBody");
    tbody.innerHTML = "";
    const sortedHistory = [...playerHistory].reverse();
    sortedHistory.forEach((h, index) => {
        const tr = document.createElement("tr");
        const dateCell = document.createElement("td");
        dateCell.innerText = h.date.replace("_", " ");
        const ratingCell = document.createElement("td");
        ratingCell.innerText = h.rating;
        const changeCell = document.createElement("td");
        const prev = sortedHistory[index + 1];
        if (prev) {
            const diff = parseInt(h.rating) - parseInt(prev.rating);
            if (diff > 0) { changeCell.innerText = "+" + diff; changeCell.className = "change-up"; }
            else if (diff < 0) { changeCell.innerText = diff; changeCell.className = "change-down"; }
            else { changeCell.innerText = "0"; }
        } else { changeCell.innerText = "-"; }
        tr.appendChild(dateCell);
        tr.appendChild(ratingCell);
        tr.appendChild(changeCell);
        tbody.appendChild(tr);
    });
}

function drawChart() {
    const ctx = document.getElementById("ratingChart");
    if (window.ratingChartInstance) window.ratingChartInstance.destroy();
    window.ratingChartInstance = new Chart(ctx, {
        type: "line",
        data: {
            labels: playerHistory.map(h => h.date.replace("_", " ")),
            datasets: [{
                label: "Rating",
                data: playerHistory.map(h => h.rating),
                borderColor: "#FFA500",
                backgroundColor: "rgba(255, 165, 0, 0.1)",
                borderWidth: 2,
                pointRadius: 4,
                pointBackgroundColor: "#0B1120",
                pointBorderColor: "#FFA500",
                tension: 0.3,
                fill: true
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
                y: { grid: { color: "#334155" }, ticks: { color: "#94A3B8", font: { size: 10 } } },
                x: { grid: { display: false }, ticks: { color: "#94A3B8", font: { size: 10 } } }
            }
        }
    });
}
getLatestFile();
</script>
</body>
</html>
