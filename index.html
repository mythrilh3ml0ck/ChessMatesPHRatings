<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#0B1120">
<title>Chessmates Philippine Rating</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root{
--bg-deep:#0B1120;
--bg-card:#1E293B;
--text-main:#FFFFFF;
--text-muted:#94A3B8;
--orange:#FFA500;
--border:#334155;
}

*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html{
-webkit-text-size-adjust:100%;
scroll-behavior:smooth;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#0B1120;
background-image:
linear-gradient(to bottom,rgba(11,17,32,.92),rgba(11,17,32,1)),
url('https://images.unsplash.com/photo-1529699211952-734e80c4d42b?auto=format&fit=crop&q=80&w=2000');
background-size:cover;
background-position:center;
background-repeat:no-repeat;
color:#fff;
min-height:100vh;
overflow-x:hidden;
}

header{
position:sticky;
top:0;
z-index:100;
background:rgba(30,41,59,.85);
backdrop-filter:blur(8px);
border-bottom:1px solid var(--border);
padding:14px;
text-align:center;
}

.header-title{
margin:0;
font-size:18px;
font-weight:700;
color:var(--orange);
}

.container{
width:100%;
max-width:700px;
margin:auto;
padding:16px;
}

.hero-logo{
width:100%;
max-width:220px;
display:block;
margin:0 auto 20px auto;
border-radius:16px;
box-shadow:0 10px 30px rgba(0,0,0,.5);
}

.hero-title{
margin:0 0 10px 0;
font-size:clamp(26px,7vw,48px);
font-weight:800;
text-align:center;
color:var(--orange);
}

.hero-subtitle{
margin:0 auto 24px auto;
font-size:15px;
text-align:center;
color:var(--text-muted);
max-width:500px;
line-height:1.5;
}

.search-container{
width:100%;
max-width:600px;
margin:auto;
position:relative;
}

.search-input-wrapper{
position:relative;
}

.search-icon{
position:absolute;
left:14px;
top:50%;
transform:translateY(-50%);
color:var(--text-muted);
}

input{
width:100%;
padding:15px 15px 15px 44px;
background:var(--bg-card);
border:1px solid var(--border);
border-radius:14px;
color:#fff;
font-size:16px;
outline:none;
}

input:focus{
border-color:var(--orange);
}

.results{
display:none;
margin-top:12px;
background:var(--bg-card);
border:1px solid var(--border);
border-radius:14px;
overflow:hidden;
max-height:300px;
overflow-y:auto;
box-shadow:0 10px 25px rgba(0,0,0,.35);
}

.result-item{
padding:16px 18px;
font-size:15px;
text-align:left;
border-bottom:1px solid var(--border);
cursor:pointer;
}

.result-item:last-child{
border-bottom:none;
}

.result-item:hover{
background:rgba(255,255,255,.03);
}

.profile{
display:none;
}

.back-btn{
display:inline-flex;
align-items:center;
gap:8px;
padding:10px 16px;
background:var(--bg-card);
border:1px solid var(--border);
border-radius:10px;
color:#fff;
cursor:pointer;
margin-bottom:20px;
}

.profile-header{
text-align:center;
padding-bottom:18px;
margin-bottom:20px;
border-bottom:1px solid var(--border);
}

.profile-name{
margin:0;
font-size:clamp(24px,6vw,34px);
font-weight:800;
}

.profile-title{
color:var(--orange);
}

.profile-rating{
margin-top:10px;
font-size:20px;
font-weight:700;
color:var(--orange);
}

.card{
width:100%;
background:var(--bg-card);
border:1px solid var(--border);
border-radius:16px;
padding:14px;
margin-top:16px;
overflow-x:auto;
}

.history-table{
width:100%;
border-collapse:collapse;
min-width:280px;
}

.history-table th{
font-size:12px;
padding-bottom:12px;
text-transform:uppercase;
color:var(--text-muted);
}

.history-table td{
padding:14px 6px;
border-top:1px solid var(--border);
text-align:center;
font-size:14px;
}

.change-up{
color:#4ADE80;
font-weight:700;
}

.change-down{
color:#F87171;
font-weight:700;
}

.chart-container{
position:relative;
width:100%;
height:260px;
}

canvas{
width:100%!important;
height:100%!important;
}

footer{
text-align:center;
padding:30px 16px;
border-top:1px solid var(--border);
color:var(--text-muted);
font-size:13px;
margin-top:30px;
}

@media(max-width:768px){

.container{
padding:14px;
}

.hero-logo{
max-width:180px;
}

.hero-subtitle{
font-size:14px;
}

.profile-rating{
font-size:18px;
}

.chart-container{
height:220px;
}

.history-table th,
.history-table td{
font-size:13px;
padding:10px 4px;
}

}
</style>
</head>

<body>

<header>
<h2 class="header-title">Chessmates Philippine Rating</h2>
</header>

<div class="container">

<div id="mainView">

<img src="https://raw.githubusercontent.com/mythrilh3ml0ck/ChessMatesPHRatings/main/chessmates_logo.png" class="hero-logo" alt="Logo">

<h1 class="hero-title">Chessmates Philippine Rating</h1>

<p class="hero-subtitle">
Track rating movements for CMP Club
</p>

<div class="search-container">

<div class="search-input-wrapper">

<div class="search-icon">
🔍
</div>

<input type="text" id="searchBox" placeholder="LastName, FirstName or ID..." autocomplete="off">

</div>

<div class="results" id="results"></div>

</div>

</div>

<div class="profile" id="profile">

<button onclick="goBack()" class="back-btn">
← Back
</button>

<div class="profile-header">

<h2 id="playerName" class="profile-name"></h2>

<div id="playerRating" class="profile-rating"></div>

</div>

<h3 style="margin:0;font-size:18px;text-align:center;">
Chessmates Philippine Rating History
</h3>

<div class="card">

<table class="history-table">

<thead>
<tr>
<th>Date</th>
<th>Rating</th>
<th>+/-</th>
</tr>
</thead>

<tbody id="ratingHistoryBody"></tbody>

</table>

</div>

<div class="card">

<div class="chart-container">
<canvas id="ratingChart"></canvas>
</div>

</div>

</div>

</div>

<footer>
© 2026 All rights reserved | Powered by The Lounge & Chess Lounge
</footer>

<script>
const repoAPI="https://api.github.com/repos/mythrilh3ml0ck/ChessMatesPHRatings/contents/CMP";

let cachedData=[];
let fallbackData=[];
let historyFiles=[];
let playerHistory=[];

async function getLatestFile(){

try{

const res=await fetch(repoAPI);

const data=await res.json();

let monthlyFiles=data.filter(f=>
f.name.toLowerCase().endsWith(".csv") &&
!["phrating.csv","phratings.csv","phrapid.csv"]
.includes(f.name.toLowerCase())
);

historyFiles=monthlyFiles.sort((a,b)=>{
return new Date(a.name)-new Date(b.name);
});

if(historyFiles.length>0){

const latestFile=historyFiles[historyFiles.length-1].download_url;

const csvRes=await fetch(latestFile);

cachedData=parseCSV(await csvRes.text());
}

const rapidFile=data.find(f=>
f.name.toLowerCase()==="phrapid.csv"
);

if(rapidFile){

const rapidRes=await fetch(rapidFile.download_url);

fallbackData=parseCSV(await rapidRes.text());
}

}catch(e){

console.log(e);
}
}

function parseCSV(text){

const lines=text.split(/\r?\n/).filter(l=>l.trim());

if(lines.length<1)return[];

const headers=lines[0].split(",");

return lines.slice(1).map(line=>{

const values=line.split(",");

let obj={};

headers.forEach((h,i)=>{
obj[h.trim()]=values[i]?values[i].trim():"";
});

return obj;
});
}

document.getElementById("searchBox")
.addEventListener("input",function(){

performSearch(this.value.toLowerCase().trim());

});

function performSearch(query){

const container=document.getElementById("results");

if(query.length<2){

container.style.display="none";

return;
}

const filterFunc=(p)=>{

const ln=(p.LastName||"").toLowerCase();

const fn=(p.FirstName||p.FirstNamme||"").toLowerCase();

const id=(p.ID_No||"").toLowerCase();

if(query.includes(",")){

const parts=query.split(",").map(x=>x.trim());

return ln.startsWith(parts[0]) &&
fn.startsWith(parts[1]||"");
}

return ln.startsWith(query) ||
id.startsWith(query);
};

let results=cachedData.filter(filterFunc);

if(results.length===0){

results=fallbackData
.filter(filterFunc)
.map(p=>({...p,isNational:true}));
}

if(results.length>0){

container.innerHTML="";

container.style.display="block";

results.forEach(p=>{

const div=document.createElement("div");

div.className="result-item";

div.innerText=
p.LastName+", "+(p.FirstName||p.FirstNamme||"");

div.onclick=()=>showProfile(p);

container.appendChild(div);

});

}else{

container.style.display="none";
}
}

async function showProfile(player){

document.getElementById("mainView").style.display="none";

document.getElementById("profile").style.display="block";

const titleText=
(player.TITLE &&
player.TITLE.trim()!=="" &&
player.TITLE!=="0")
?player.TITLE.trim()
:"";

const nameEl=document.getElementById("playerName");

nameEl.innerHTML="";

if(titleText){

const span=document.createElement("span");

span.className="profile-title";

span.innerText=titleText+" ";

nameEl.appendChild(span);
}

nameEl.appendChild(
document.createTextNode(
(player.FirstName||player.FirstNamme||"")+" "+player.LastName
)
);

const ratingEl=document.getElementById("playerRating");

if(player.Rtg_Nat && player.Rtg_Nat!=="0"){

ratingEl.innerText=
(player.isNational?"National Rating: ":"CMP: ")
+player.Rtg_Nat;

}else{

ratingEl.style.display="none";
}

playerHistory=[];

for(let file of historyFiles){

const res=await fetch(file.download_url);

const text=await res.text();

const data=parseCSV(text);

const found=data.find(p=>p.ID_No===player.ID_No);

if(found){

playerHistory.push({
date:file.name.replace(".csv",""),
rating:found.Rtg_Nat
});
}
}

displayHistory();

drawChart();

window.scrollTo(0,0);
}

function goBack(){

document.getElementById("profile").style.display="none";

document.getElementById("mainView").style.display="block";

document.getElementById("searchBox").value="";

document.getElementById("results").style.display="none";

if(window.ratingChartInstance){
window.ratingChartInstance.destroy();
}
}

function displayHistory(){

const tbody=document.getElementById("ratingHistoryBody");

tbody.innerHTML="";

const sorted=[...playerHistory].reverse();

sorted.forEach((h,index)=>{

const tr=document.createElement("tr");

const prev=sorted[index+1];

let diffText="-";
let diffClass="";

if(prev){

const diff=parseInt(h.rating)-parseInt(prev.rating);

if(diff>0){
diffText="+"+diff;
diffClass="change-up";
}else if(diff<0){
diffText=diff;
diffClass="change-down";
}else{
diffText="0";
}
}

tr.innerHTML=`
<td>${h.date.replace("_"," ")}</td>
<td>${h.rating}</td>
<td class="${diffClass}">${diffText}</td>
`;

tbody.appendChild(tr);

});
}

function drawChart(){

const ctx=document.getElementById("ratingChart");

if(window.ratingChartInstance){
window.ratingChartInstance.destroy();
}

window.ratingChartInstance=new Chart(ctx,{
type:"line",
data:{
labels:playerHistory.map(h=>h.date.replace("_"," ")),
datasets:[{
data:playerHistory.map(h=>h.rating),
borderColor:"#FFA500",
backgroundColor:"rgba(255,165,0,.1)",
borderWidth:2,
tension:.3,
fill:true
}]
},
options:{
responsive:true,
maintainAspectRatio:false,
plugins:{
legend:{
display:false
}
},
scales:{
y:{
ticks:{
color:"#94A3B8"
},
grid:{
color:"#334155"
}
},
x:{
ticks:{
color:"#94A3B8"
},
grid:{
display:false
}
}
}
}
});
}

getLatestFile();
</script>

</body>
</html>
