<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no,
      viewport-fit=cover">

<meta name="theme-color" content="#0B1120">

<title>Chessmates Philippine Rating</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

:root {
    --bg-deep: #0B1120;
    --bg-card: #1E293B;
    --text-main: #FFFFFF;
    --text-muted: #94A3B8;
    --orange: #FFA500;
    --orange-hover: #E69500;
    --border: #334155;
}

html {
    -webkit-text-size-adjust: 100%;
    scroll-behavior: smooth;
}

*,
*::before,
*::after {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;

    margin: 0;

    background-color: var(--bg-deep);

    background-image:
        radial-gradient(circle at top right, rgba(255,165,0,0.05), transparent),
        linear-gradient(to bottom, rgba(11,17,32,0.88), rgba(11,17,32,1)),
        url('https://images.unsplash.com/photo-1529699211952-734e80c4d42b?auto=format&fit=crop&q=80&w=2000');

    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;

    /* MOBILE FIX */
    background-attachment: scroll;

    color: var(--text-main);

    min-height: 100vh;

    display: flex;
    flex-direction: column;
    align-items: center;

    overflow-x: hidden;

    touch-action: manipulation;

    user-select: none;
    -webkit-user-select: none;
}

/* HEADER */

header {
    width: 100%;

    position: sticky;
    top: 0;

    z-index: 100;

    background: rgba(30,41,59,0.82);

    backdrop-filter: blur(8px);

    border-bottom: 1px solid var(--border);

    padding: 14px 16px;

    padding-top: calc(14px + env(safe-area-inset-top));

    display: flex;
    justify-content: center;
    align-items: center;
}

.header-content {
    width: 100%;
    max-width: 700px;

    display: flex;
    justify-content: center;
    align-items: center;
}

.header-title {
    margin: 0;

    color: var(--orange);

    font-size: 18px;
    font-weight: 800;

    text-align: center;
}

/* CONTAINER */

.container {
    flex: 1 0 auto;

    width: 100%;
    max-width: 700px;

    padding: 18px;

    display: flex;
    flex-direction: column;
    align-items: center;
}

#mainView,
#profile {
    width: 100%;
}

/* HERO */

.hero-logo {
    width: 100%;
    max-width: 220px;

    display: block;

    margin: 0 auto 22px auto;

    border-radius: 18px;

    box-shadow: 0 12px 40px rgba(0,0,0,0.6);
}

.hero-title {
    font-size: clamp(26px, 7vw, 48px);

    font-weight: 800;

    line-height: 1.2;

    text-align: center;

    color: var(--orange);

    margin: 0 0 10px 0;
}

.hero-subtitle {
    color: var(--text-muted);

    font-size: clamp(14px, 4vw, 18px);

    line-height: 1.5;

    text-align: center;

    margin: 0 auto 28px auto;

    max-width: 500px;
}

/* SEARCH */

.search-container {
    width: 100%;
    max-width: 600px;

    margin: 0 auto;

    position: relative;
}

.search-input-wrapper {
    position: relative;
    width: 100%;
}

.search-icon {
    position: absolute;

    left: 14px;
    top: 50%;

    transform: translateY(-50%);

    color: var(--text-muted);
}

input {
    width: 100%;

    padding: 15px 16px 15px 44px;

    border-radius: 14px;

    border: 1px solid var(--border);

    background: var(--bg-card);

    color: white;

    font-size: 16px;

    outline: none;

    transition: 0.2s;

    -webkit-appearance: none;
}

input:focus {
    border-color: var(--orange);

    box-shadow: 0 0 0 3px rgba(255,165,0,0.12);
}

/* RESULTS */

.results {
    width: 100%;

    margin-top: 12px;

    background: var(--bg-card);

    border: 1px solid var(--border);

    border-radius: 14px;

    overflow: hidden;

    max-height: 300px;

    overflow-y: auto;

    display: none;

    box-shadow: 0 10px 25px rgba(0,0,0,0.35);
}

.result-item {
    padding: 16px;

    font-size: 15px;

    text-align: center;

    border-bottom: 1px solid var(--border);

    cursor: pointer;

    transition: 0.2s;
}

.result-item:last-child {
    border-bottom: none;
}

.result-item:hover {
    background: rgba(255,255,255,0.03);
}

/* PROFILE */

.profile {
    display: none;

    text-align: center;

    width: 100%;
}

.back-btn {
    display: inline-flex;

    align-items: center;
    gap: 8px;

    background: var(--bg-card);

    border: 1px solid var(--border);

    color: white;

    padding: 10px 16px;

    border-radius: 10px;

    cursor: pointer;

    margin-bottom: 22px;

    font-size: 14px;

    font-weight: 600;
}

.profile-header {
    margin-bottom: 22px;

    padding-bottom: 18px;

    border-bottom: 1px solid var(--border);
}

.profile-name {
    margin: 0;

    font-size: clamp(24px, 6vw, 34px);

    line-height: 1.2;

    font-weight: 800;
}

.profile-title {
    color: var(--orange);
}

.profile-rating {
    margin-top: 10px;

    color: var(--orange);

    font-size: clamp(18px, 4vw, 22px);

    font-weight: 700;
}

/* CARDS */

.card {
    width: 100%;

    background: var(--bg-card);

    border: 1px solid var(--border);

    border-radius: 18px;

    padding: 16px;

    margin-top: 16px;

    overflow-x: auto;

    -webkit-overflow-scrolling: touch;
}

/* TABLE */

.history-table {
    width: 100%;

    border-collapse: collapse;

    min-width: 280px;
}

.history-table th {
    color: var(--text-muted);

    font-size: 12px;

    text-transform: uppercase;

    letter-spacing: 0.05em;

    padding-bottom: 12px;

    text-align: center;
}

.history-table td {
    border-top: 1px solid var(--border);

    padding: 14px 6px;

    text-align: center;

    font-size: 14px;
}

.change-up {
    color: #4ADE80;
    font-weight: 700;
}

.change-down {
    color: #F87171;
    font-weight: 700;
}

/* CHART */

.chart-container {
    position: relative;

    width: 100%;

    height: 260px;
}

canvas {
    width: 100% !important;
    height: 100% !important;
}

/* FOOTER */

footer {
    width: 100%;

    text-align: center;

    padding: 30px 18px;

    border-top: 1px solid var(--border);

    color: var(--text-muted);

    font-size: 13px;
}

/* TABLET & DESKTOP */

@media (min-width: 768px) {

    .container {
        padding: 28px;
    }

    .hero-title {
        font-size: 48px;
    }

    .hero-subtitle {
        font-size: 18px;
    }
}

/* MOBILE */

@media (max-width: 768px) {

    body {
        font-size: 14px;
    }

    header {
        padding: 12px;
    }

    .header-title {
        font-size: 16px;
    }

    .container {
        padding: 14px;
    }

    .hero-logo {
        max-width: 190px;
    }

    .hero-subtitle {
        padding: 0 8px;
    }

    .profile-name {
        font-size: 24px;
    }

    .profile-rating {
        font-size: 18px;
    }

    .history-table th,
    .history-table td {
        font-size: 13px;
        padding: 10px 4px;
    }

    .chart-container {
        height: 220px;
    }
}

</style>
</head>

<body oncontextmenu="return false;">

<header>
    <div class="header-content">
        <h2 class="header-title">
            Chessmates Philippine Rating
        </h2>
    </div>
</header>

<div class="container">

    <!-- MAIN VIEW -->

    <div id="mainView">

        <img
            src="https://raw.githubusercontent.com/mythrilh3ml0ck/ChessMatesPHRatings/main/chessmates_logo.png"
            class="hero-logo"
            alt="Main Logo">

        <h1 class="hero-title">
            Chessmates Philippine Rating
        </h1>

        <p class="hero-subtitle">
            Track rating movements for CMP Club
        </p>

        <div class="search-container">

            <div class="search-input-wrapper">

                <div class="search-icon">
                    <svg width="18"
                         height="18"
                         viewBox="0 0 24 24"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="2"
                         stroke-linecap="round"
                         stroke-linejoin="round">

                        <circle cx="11" cy="11" r="8"></circle>

                        <line x1="21"
                              y1="21"
                              x2="16.65"
                              y2="16.65"></line>

                    </svg>
                </div>

                <input
                    type="text"
                    id="searchBox"
                    placeholder="LastName, FirstName or ID..."
                    autocomplete="off">

            </div>

            <div class="results" id="results"></div>

        </div>

    </div>

    <!-- PROFILE -->

    <div class="profile" id="profile">

        <button onclick="goBack()" class="back-btn">

            <svg width="16"
                 height="16"
                 viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="2">

                <line x1="19" y1="12" x2="5" y2="12"></line>

                <polyline points="12 19 5 12 12 5"></polyline>

            </svg>

            Back

        </button>

        <div class="profile-header">

            <h2 id="playerName" class="profile-name"></h2>

            <div id="playerRating" class="profile-rating"></div>

        </div>

        <h3 style="margin:0; font-size:18px;">
            Chessmates Philippine Rating History
        </h3>

        <!-- TABLE CARD -->

        <div class="card">

            <table class="history-table">

                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Rating</th>
                        <th>+/-</th>
                    </tr>
                </thead>

                <tbody id="ratingHistoryBody"></tbody>

            </table>

        </div>

        <!-- CHART CARD -->

        <div class="card">

            <div class="chart-container">
                <canvas id="ratingChart"></canvas>
            </div>

        </div>

    </div>

</div>

<footer>
    © 2026 All rights reserved |
    Powered by The Lounge & Chess Lounge
</footer>

<script>

/* DISABLE RIGHT CLICK */

document.addEventListener('contextmenu', e => e.preventDefault());

document.addEventListener('keydown', e => {

    if (
        e.key === 'F12' ||

        (e.ctrlKey && e.shiftKey &&
            (e.key === 'I' ||
             e.key === 'C' ||
             e.key === 'J')) ||

        (e.ctrlKey && e.key === 'U') ||

        (e.ctrlKey && e.key === 'S') ||

        (e.metaKey && e.key === 'u') ||

        (e.metaKey && e.key === 's')
    ) {
        e.preventDefault();
        return false;
    }
});

/* GITHUB API */

const repoAPI =
"https://api.github.com/repos/mythrilh3ml0ck/ChessMatesPHRatings/contents/CMP";

let cachedData = [];
let fallbackData = [];
let latestFile = "";
let historyFiles = [];
let playerHistory = [];

/* LOAD FILES */

async function getLatestFile() {

    try {

        const res = await fetch(repoAPI);

        const data = await res.json();

        let monthlyFiles = data.filter(f =>
            f.name.toLowerCase().endsWith(".csv") &&
            !["phrating.csv","phratings.csv","phrapid.csv"]
            .includes(f.name.toLowerCase())
        );

        historyFiles = monthlyFiles.sort((a, b) => {

            const dateA = new Date(
                a.name.replace(".csv", "").replace("_", " ")
            );

            const dateB = new Date(
                b.name.replace(".csv", "").replace("_", " ")
            );

            return dateA - dateB;
        });

        if (historyFiles.length > 0) {

            latestFile =
                historyFiles[historyFiles.length - 1].download_url;

            const csvRes = await fetch(latestFile);

            cachedData =
                parseCSV(await csvRes.text());
        }

        const rapidFile = data.find(f =>
            f.name.toLowerCase() === "phrapid.csv"
        );

        if (rapidFile) {

            const rapidRes =
                await fetch(rapidFile.download_url);

            fallbackData =
                parseCSV(await rapidRes.text());
        }

    } catch (e) {

        console.error("Initialization failed", e);
    }
}

/* CSV PARSER */

function parseCSV(text) {

    const lines = text
        .split(/\r?\n/)
        .filter(l => l.trim().length > 0);

    if (lines.length < 1) return [];

    const headers = lines[0]
        .split(",")
        .map(h => h.trim());

    return lines.slice(1).map(line => {

        const values =
            line.split(",").map(v => v.trim());

        let obj = {};

        headers.forEach((h, i) => {

            if (h) {
                obj[h] = values[i] || "";
            }
        });

        return obj;
    });
}

/* SEARCH */

document.getElementById("searchBox")
.addEventListener("input", function() {

    performSearch(this.value.toLowerCase().trim());
});

function performSearch(query) {

    const container =
        document.getElementById("results");

    if (query.length < 2) {

        container.style.display = "none";

        return;
    }

    const filterFunc = (p) => {

        const ln =
            (p.LastName || "").toLowerCase();

        const fn =
            (p.FirstName ||
             p.FirstNamme ||
             "").toLowerCase();

        const id =
            (p.ID_No || "").toLowerCase();

        if (query.includes(',')) {

            const parts =
                query.split(',').map(x => x.trim());

            const qLn = parts[0];
            const qFn = parts[1] || "";

            return (
                ln.startsWith(qLn) &&
                fn.startsWith(qFn)
            );
        }

        return (
            ln.startsWith(query) ||
            id.startsWith(query)
        );
    };

    let results =
        cachedData.filter(filterFunc);

    if (results.length === 0) {

        results = fallbackData
            .filter(filterFunc)
            .map(p => ({
                ...p,
                isNational: true
            }));
    }

    if (results.length > 0) {

        container.innerHTML = "";

        container.style.display = "block";

        results.forEach(p => {

            const div =
                document.createElement("div");

            div.className = "result-item";

            div.innerText =
                p.LastName +
                ", " +
                (p.FirstName ||
                 p.FirstNamme ||
                 "");

            div.onclick = () => showProfile(p);

            container.appendChild(div);
        });

    } else {

        container.style.display = "none";
    }
}

/* SHOW PROFILE */

async function showProfile(player) {

    document.getElementById("mainView")
        .style.display = "none";

    document.getElementById("profile")
        .style.display = "block";

    const titleText =
        (
            player.TITLE &&
            player.TITLE.trim() !== "" &&
            player.TITLE !== "0"
        )
        ? player.TITLE.trim()
        : "";

    const nameEl =
        document.getElementById("playerName");

    nameEl.innerHTML = "";

    if (titleText) {

        const titleSpan =
            document.createElement("span");

        titleSpan.className = "profile-title";

        titleSpan.innerText = titleText + " ";

        nameEl.appendChild(titleSpan);
    }

    nameEl.appendChild(
        document.createTextNode(
            (player.FirstName ||
             player.FirstNamme ||
             "") +
            " " +
            player.LastName
        )
    );

    const ratingEl =
        document.getElementById("playerRating");

    if (
        player.Rtg_Nat &&
        player.Rtg_Nat !== "0" &&
        player.Rtg_Nat !== ""
    ) {

        ratingEl.innerText =
            (
                player.isNational
                ? "National Rating: "
                : "CMP: "
            ) +
            player.Rtg_Nat;

        ratingEl.style.display = "block";

    } else {

        ratingEl.style.display = "none";
    }

    playerHistory = [];

    for (let file of historyFiles) {

        const res =
            await fetch(file.download_url);

        const text = await res.text();

        const data = parseCSV(text);

        const found = data.find(
            p => p.ID_No === player.ID_No
        );

        if (found) {

            playerHistory.push({
                date: file.name.replace(".csv",""),
                rating: found.Rtg_Nat
            });
        }
    }

    displayHistory();

    drawChart();

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}

/* BACK */

function goBack() {

    document.getElementById("profile")
        .style.display = "none";

    document.getElementById("mainView")
        .style.display = "block";

    document.getElementById("searchBox")
        .value = "";

    document.getElementById("results")
        .style.display = "none";

    if (window.ratingChartInstance) {

        window.ratingChartInstance.destroy();
    }

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}

/* HISTORY TABLE */

function displayHistory() {

    const tbody =
        document.getElementById("ratingHistoryBody");

    tbody.innerHTML = "";

    const sortedHistory =
        [...playerHistory].reverse();

    sortedHistory.forEach((h, index) => {

        const tr =
            document.createElement("tr");

        const dateCell =
            document.createElement("td");

        dateCell.innerText =
            h.date.replace("_", " ");

        const ratingCell =
            document.createElement("td");

        ratingCell.innerText = h.rating;

        const changeCell =
            document.createElement("td");

        const prev =
            sortedHistory[index + 1];

        if (prev) {

            const diff =
                parseInt(h.rating) -
                parseInt(prev.rating);

            if (diff > 0) {

                changeCell.innerText =
                    "+" + diff;

                changeCell.className =
                    "change-up";

            } else if (diff < 0) {

                changeCell.innerText =
                    diff;

                changeCell.className =
                    "change-down";

            } else {

                changeCell.innerText = "0";
            }

        } else {

            changeCell.innerText = "-";
        }

        tr.appendChild(dateCell);
        tr.appendChild(ratingCell);
        tr.appendChild(changeCell);

        tbody.appendChild(tr);
    });
}

/* CHART */

function drawChart() {

    const ctx =
        document.getElementById("ratingChart");

    if (window.ratingChartInstance) {

        window.ratingChartInstance.destroy();
    }

    window.ratingChartInstance =
        new Chart(ctx, {

        type: "line",

        data: {

            labels:
                playerHistory.map(h =>
                    h.date.replace("_", " ")
                ),

            datasets: [{

                label: "Rating",

                data:
                    playerHistory.map(h =>
                        h.rating
                    ),

                borderColor: "#FFA500",

                backgroundColor:
                    "rgba(255,165,0,0.10)",

                borderWidth: 2,

                pointRadius: 4,

                pointBackgroundColor: "#0B1120",

                pointBorderColor: "#FFA500",

                tension: 0.3,

                fill: true
            }]
        },

        options: {

            responsive: true,

            maintainAspectRatio: false,

            plugins: {

                legend: {
                    display: false
                }
            },

            scales: {

                y: {

                    grid: {
                        color: "#334155"
                    },

                    ticks: {
                        color: "#94A3B8",
                        font: {
                            size: 10
                        }
                    }
                },

                x: {

                    grid: {
                        display: false
                    },

                    ticks: {
                        color: "#94A3B8",
                        font: {
                            size: 10
                        }
                    }
                }
            }
        }
    });
}

/* INIT */

getLatestFile();

</script>

</body>
</html>
