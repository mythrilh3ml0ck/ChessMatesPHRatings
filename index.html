<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#0B1120">
<title>Chessmates Philippine Rating</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root{
--bg-deep:#0B1120;
--bg-card:#1E293B;
--text-main:#FFFFFF;
--text-muted:#94A3B8;
--orange:#FFA500;
--border:#334155;
}

*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#0B1120;
color:#fff;
min-height:100vh;
overflow-x:hidden;
}

header{
position:sticky;
top:0;
background:rgba(30,41,59,.9);
border-bottom:1px solid var(--border);
padding:14px;
text-align:center;
z-index:100;
}

.header-title{
margin:0;
font-size:18px;
color:var(--orange);
font-weight:700;
}

.container{
width:100%;
max-width:700px;
margin:auto;
padding:16px;
}

.hero-logo{
width:100%;
max-width:220px;
display:block;
margin:0 auto 20px auto;
border-radius:16px;
}

.hero-title{
text-align:center;
color:var(--orange);
font-size:32px;
margin:0;
font-weight:800;
}

.hero-subtitle{
text-align:center;
color:var(--text-muted);
margin:10px 0 20px;
}

.search-container{
width:100%;
max-width:600px;
margin:auto;
}

.search-input-wrapper{
position:relative;
}

.search-icon{
position:absolute;
left:14px;
top:50%;
transform:translateY(-50%);
}

input{
width:100%;
padding:15px 15px 15px 44px;
border-radius:14px;
border:1px solid var(--border);
background:var(--bg-card);
color:#fff;
font-size:16px;
outline:none;
}

.results{
display:none;
margin-top:10px;
background:var(--bg-card);
border:1px solid var(--border);
border-radius:12px;
max-height:300px;
overflow-y:auto;
}

.result-item{
padding:14px 16px;
border-bottom:1px solid var(--border);
cursor:pointer;
text-align:left;
}

.result-item:hover{
background:rgba(255,255,255,0.05);
}

.profile{
display:none;
}

.back-btn{
padding:10px 14px;
background:var(--bg-card);
border:1px solid var(--border);
color:#fff;
border-radius:10px;
margin-bottom:20px;
}

.profile-header{
text-align:center;
border-bottom:1px solid var(--border);
padding-bottom:16px;
margin-bottom:16px;
}

.profile-name{
font-size:28px;
font-weight:800;
margin:0;
}

.profile-rating{
color:var(--orange);
margin-top:8px;
font-size:18px;
font-weight:700;
}

.card{
background:var(--bg-card);
border:1px solid var(--border);
border-radius:14px;
padding:14px;
margin-top:14px;
overflow-x:auto;
}

.history-table{
width:100%;
border-collapse:collapse;
min-width:280px;
}

.history-table th,
.history-table td{
text-align:center;
padding:12px;
border-top:1px solid var(--border);
font-size:14px;
}

.change-up{color:#4ADE80;font-weight:700;}
.change-down{color:#F87171;font-weight:700;}

.chart-container{
height:260px;
}

canvas{
width:100%!important;
height:100%!important;
}

footer{
text-align:center;
padding:30px;
color:var(--text-muted);
font-size:13px;
}
</style>
</head>

<body>

<header>
<h2 class="header-title">Chessmates Philippine Rating</h2>
</header>

<div class="container">

<div id="mainView">

<img src="https://raw.githubusercontent.com/mythrilh3ml0ck/ChessMatesPHRatings/main/chessmates_logo.png" class="hero-logo">

<h1 class="hero-title">Chessmates Philippine Rating</h1>
<p class="hero-subtitle">Track rating movements for CMP Club</p>

<div class="search-container">
<div class="search-input-wrapper">
<div class="search-icon">🔍</div>
<input type="text" id="searchBox" placeholder="LastName, FirstName or ID..." autocomplete="off">
</div>
<div class="results" id="results"></div>
</div>

</div>

<div class="profile" id="profile">

<button class="back-btn" onclick="goBack()">← Back</button>

<div class="profile-header">
<h2 id="playerName" class="profile-name"></h2>
<div id="playerRating" class="profile-rating"></div>
</div>

<div class="card">
<table class="history-table">
<thead>
<tr><th>Date</th><th>Rating</th><th>+/-</th></tr>
</thead>
<tbody id="ratingHistoryBody"></tbody>
</table>
</div>

<div class="card">
<div class="chart-container">
<canvas id="ratingChart"></canvas>
</div>
</div>

</div>

</div>

<footer>
© 2026 Chessmates Rating System
</footer>

<script>
const repoAPI="https://api.github.com/repos/mythrilh3ml0ck/ChessMatesPHRatings/contents/CMP";

let cachedData=[];
let fallbackData=[];
let historyFiles=[];
let playerHistory=[];

async function getLatestFile(){
try{
const res=await fetch(repoAPI);
const data=await res.json();

const files=data.filter(f=>f.name.endsWith(".csv"));

historyFiles=files.sort((a,b)=>new Date(a.name)-new Date(b.name));

if(historyFiles.length){
const latest=await fetch(historyFiles[historyFiles.length-1].download_url);
cachedData=parseCSV(await latest.text());
}

const rapid=data.find(f=>f.name.toLowerCase()==="phrapid.csv");

if(rapid){
const r=await fetch(rapid.download_url);
fallbackData=parseCSV(await r.text());
}

}catch(e){console.log(e);}
}

function parseCSV(text){
const lines=text.split(/\r?\n/).filter(l=>l);
const headers=lines[0].split(",");
return lines.slice(1).map(l=>{
const v=l.split(",");
let o={};
headers.forEach((h,i)=>o[h.trim()]=v[i]?.trim()||"");
return o;
});
}

document.getElementById("searchBox").addEventListener("input",e=>{
performSearch(e.target.value.toLowerCase().trim());
});

function performSearch(query){
const container=document.getElementById("results");

if(query.length<2){
container.style.display="none";
return;
}

const match=p=>{
const ln=(p.LastName||"").toLowerCase();
const fn=(p.FirstName||p.FirstNamme||"").toLowerCase();
const full=(ln+" "+fn).trim();
const id=(p.ID_No||"").toLowerCase();

if(query.includes(",")){
const [qLn,qFn]=query.split(",").map(x=>x.trim());
return ln.startsWith(qLn)&&fn.startsWith(qFn);
}

return ln.startsWith(query)||full.includes(query)||id.startsWith(query);
};

let latest=cachedData.filter(match);
let rapid=fallbackData.filter(match).map(p=>({...p,isNational:true}));

const ids=new Set(latest.map(p=>p.ID_No));
rapid=rapid.filter(p=>!ids.has(p.ID_No));

const results=[...latest,...rapid];

container.innerHTML="";
if(!results.length){container.style.display="none";return;}

container.style.display="block";

results.forEach(p=>{
const div=document.createElement("div");
div.className="result-item";
div.innerText=p.LastName+", "+(p.FirstName||p.FirstNamme||"");
div.onclick=()=>showProfile(p);
container.appendChild(div);
});
}

async function showProfile(player){
document.getElementById("mainView").style.display="none";
document.getElementById("profile").style.display="block";

document.getElementById("playerName").innerText=
(player.FirstName||player.FirstNamme||"")+" "+player.LastName;

document.getElementById("playerRating").innerText=
player.Rtg_Nat||"";

playerHistory=[];

for(let f of historyFiles){
const r=await fetch(f.download_url);
const d=parseCSV(await r.text());
const found=d.find(x=>x.ID_No===player.ID_No);
if(found){
playerHistory.push({date:f.name.replace(".csv",""),rating:found.Rtg_Nat});
}
}

displayHistory();
drawChart();
}

function goBack(){
document.getElementById("profile").style.display="none";
document.getElementById("mainView").style.display="block";
}

function displayHistory(){
const tbody=document.getElementById("ratingHistoryBody");
tbody.innerHTML="";

const s=[...playerHistory].reverse();

s.forEach((h,i)=>{
const p=s[i+1];
let diff="-";

if(p){
const d=parseInt(h.rating)-parseInt(p.rating);
diff=d>0?`+${d}`:d;
}

tbody.innerHTML+=`
<tr>
<td>${h.date}</td>
<td>${h.rating}</td>
<td>${diff}</td>
</tr>`;
});
}

function drawChart(){
const ctx=document.getElementById("ratingChart");

if(window.chart)window.chart.destroy();

window.chart=new Chart(ctx,{
type:"line",
data:{
labels:playerHistory.map(h=>h.date),
datasets:[{
data:playerHistory.map(h=>h.rating),
borderColor:"#FFA500",
tension:.3,
fill:true
}]
},
options:{
responsive:true,
maintainAspectRatio:false,
plugins:{legend:{display:false}}
}
});
}

getLatestFile();
</script>

</body>
</html>
