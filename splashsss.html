<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Syncing Chessmates Ratings</title>
    <style>
        body, html {
            height: 100%; margin: 0; padding: 0;
            background-color: #000000;
            background-image:
                linear-gradient(45deg, #080808 25%, transparent 25%, transparent 75%, #080808 75%, #080808),
                linear-gradient(45deg, #080808 25%, transparent 25%, transparent 75%, #080808 75%, #080808);
            background-size: 60px 60px;
            background-position: 0 0, 30px 30px;
            font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; overflow: hidden;
        }
        .splash-container { text-align: center; animation: fadeIn 1.2s ease-in-out; width: 100%; padding: 20px; padding-top: calc(40px + env(safe-area-inset-top)); }
        .logo { width: 250px; height: auto; margin-bottom: 30px; filter: drop-shadow(0 0 15px rgba(255, 153, 51, 0.3)); }
        .loader-bar { width: 240px; height: 4px; background: rgba(255, 153, 51, 0.2); border-radius: 10px; margin: 0 auto; position: relative; overflow: hidden; }
        .loader-progress { width: 0%; height: 100%; background: #ff9933; border-radius: 10px; transition: width 0.4s ease; }
        .loading-text { color: #ffb366; font-size: 13px; margin-top: 15px; font-weight: 500; min-height: 18px; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>
<div class="splash-container">
    <img src="images/logo/CMPR_Logo.png" alt="Logo" class="logo">
    <div id="versionText" style="color: #ff9933; font-size: 10px; margin-top: 10px; margin-bottom: 25px; opacity: 0.8;">Version 1.0.1</div>
    <div class="loader-bar"><div id="progressBar" class="loader-progress"></div></div>
    <div id="statusText" class="loading-text">Initializing sync...</div>
    <div id="errorActions" style="display: none; margin-top: 20px;">
        <button onclick="sync()" style="padding: 10px 20px; background: #ff9933; border: none; border-radius: 5px; color: black; font-weight: bold; cursor: pointer;">Retry</button>
    </div>
    <div style="margin-top: 50px; color: #ff9933; font-size: 10px; font-weight: bold; opacity: 0.6; letter-spacing: 1px;">POWERED BY<br>THE LOUNGE & CHESS LOUNGE</div>
</div>

<script>
const GITHUB_TOKEN = "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";
const historyAPI = "https://api.github.com/repos/mythrilh3ml0ck/ChessMatesPHRatings/contents/CMP/ratinghistory";
const nationalAPI = "https://api.github.com/repos/mythrilh3ml0ck/ChessMatesPHRatings/contents/CMP/nationalrating";

const DB_NAME = "RatingDB";
const STORE_NAME = "cache";

function openDB() {
    return new Promise((resolve, reject) => {
        // Bump version to 2 to ensure onupgradeneeded runs if store was missing in v1
        const request = indexedDB.open(DB_NAME, 2);
        request.onupgradeneeded = (e) => {
            const db = e.target.result;
            console.log("Upgrading DB...");
            if (!db.objectStoreNames.contains(STORE_NAME)) {
                db.createObjectStore(STORE_NAME);
                console.log("Object store created.");
            }
        };
        request.onsuccess = (e) => resolve(e.target.result);
        request.onerror = (e) => {
            console.error("DB Open Error:", e.target.error);
            reject(e.target.error);
        };
    });
}

function saveToDB(key, data) {
    return openDB().then(db => {
        return new Promise((resolve, reject) => {
            const tx = db.transaction(STORE_NAME, "readwrite");
            tx.objectStore(STORE_NAME).put(data, key);
            tx.oncomplete = () => resolve();
            tx.onerror = (e) => reject(e.target.error);
        });
    });
}

function updateUI(percent, text, isError = false) {
    document.getElementById("progressBar").style.width = percent + "%";
    const status = document.getElementById("statusText");
    status.innerText = text;
    status.style.color = isError ? "#F87171" : "#ffb366";
    document.getElementById("errorActions").style.display = isError ? "block" : "none";
}

function parseCSV(text) {
    if (!text || !text.trim()) return { h: [], r: [] };
    const cleanText = text.replace(/^\uFEFF/, '').trim();
    const lines = cleanText.split(/\r?\n/).filter(l => l.trim().length > 0);
    if (lines.length === 0) return { h: [], r: [] };

    const splitLine = (line) => {
        const values = []; let cur = ''; let inside = false;
        for (let i = 0; i < line.length; i++) {
            if (line[i] === '"') inside = !inside;
            else if (line[i] === ',' && !inside) { values.push(cur.trim()); cur = ''; }
            else cur += line[i];
        }
        values.push(cur.trim());
        return values.map(v => v.replace(/^"|"$/g, '').trim());
    };

    const firstLineValues = splitLine(lines[0]);
    const headerKeywords = ["lastname", "firstname", "rtgnat", "rtg_nat", "title", "sex", "idno", "name"];
    const isHeader = firstLineValues.some(v => headerKeywords.includes(v.toLowerCase().replace(/[^a-z]/g, '')));

    let headers = isHeader ? firstLineValues : ["TITLE", "LastName", "FirstName", "SEX", "Rtg_Nat"];
    let rows = lines.slice(isHeader ? 1 : 0).map(splitLine);

    return { h: headers, r: rows };
}

function finalizeSync() {
    localStorage.setItem("has_synced", "true");
    localStorage.setItem("last_sync_time", Date.now().toString());
    updateUI(100, "Database ready!");
    setTimeout(() => { window.location.replace('index.html'); }, 800);
}

function enterApp() {
    window.location.replace('index.html');
}

async function sync() {
    try {
        updateUI(5, "Connecting...");
        const headers = { "Authorization": `token ${GITHUB_TOKEN}` };

        let response;
        try {
            response = await fetch(historyAPI, { headers });
            if (!response.ok) throw new Error();
        } catch (e) {
            console.warn("Auth fetch failed, trying public...");
            response = await fetch(historyAPI);
        }

        if (!response.ok) throw new Error("Could not connect to database server.");

        const data = await response.json();
        if (!Array.isArray(data)) throw new Error("Invalid server response.");

        const months = ["january", "february", "march", "april", "may", "june", "july", "august", "september", "october", "november", "december"];
        let monthlyFiles = data.filter(f => f.name.toLowerCase().endsWith(".csv") && months.some(m => f.name.toLowerCase().startsWith(m)))
            .sort((a, b) => {
                try {
                    const partsA = a.name.replace(".csv", "").split(/[_-]/);
                    const partsB = b.name.replace(".csv", "").split(/[_-]/);
                    // Handle formats like "May_2026.csv"
                    return new Date(partsB[1], months.indexOf(partsB[0].toLowerCase())) -
                           new Date(partsA[1], months.indexOf(partsA[0].toLowerCase()));
                } catch(e) { return 0; }
            });

        const csvCache = {};
        let loaded = 0;
        const total = monthlyFiles.length + 1;

        for (const file of monthlyFiles) {
            try {
                const res = await fetch(file.download_url || file.url);
                if (res.ok) {
                    const text = await res.text();
                    if (text.trim()) csvCache[file.name] = parseCSV(text);
                }
            } catch (e) {
                console.error(`Failed to load ${file.name}:`, e);
            }
            loaded++;
            updateUI(10 + (loaded / total * 70), `Syncing ${file.name.split('_')[0]}...`);
        }

        try {
            updateUI(85, "Fetching National ratings...");
            let nRes;
            try {
                nRes = await fetch(nationalAPI, { headers });
            } catch(e) {
                nRes = await fetch(nationalAPI);
            }

            if (nRes && nRes.ok) {
                const nData = await nRes.json();
                const rapid = nData.find(f => f.name.toLowerCase() === "phrapid.csv");
                if (rapid) {
                    const rRes = await fetch(rapid.download_url || rapid.url);
                    if (rRes.ok) csvCache["PHRapid.csv"] = parseCSV(await rRes.text());
                }
            }
        } catch (e) {
            console.warn("National API failed:", e);
        }

        if (Object.keys(csvCache).length === 0) {
            throw new Error("No data could be retrieved.");
        }

        updateUI(95, "Saving database...");
        await saveToDB("rating_cache", csvCache);
        finalizeSync();
    } catch (e) {
        console.error("Sync error:", e);
        updateUI(50, "Sync Failed: " + (e.message || "Unknown error"), true);
        // Show enter app button if we have some old data
        if (localStorage.getItem("has_synced") === "true") {
            const errActions = document.getElementById("errorActions");
            errActions.innerHTML += '<br><button onclick="enterApp()" style="margin-top:10px; padding: 10px 20px; background: #444; border: none; border-radius: 5px; color: white; cursor: pointer;">Enter with Offline Data</button>';
        }
    }
}

document.addEventListener('DOMContentLoaded', sync);
</script>
</body>
</html>
